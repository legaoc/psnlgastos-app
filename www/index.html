function bindWizard(overlay, options){

  let step = 0;
  let lastStep = 0;
  let primed = false;

  function maxStep(){
    return typeof options.maxStep==="function"
      ? options.maxStep()
      : Number(options.maxStep||0);
  }

  function titles(){
    return typeof options.titles==="function"
      ? options.titles()
      : (options.titles||[]);
  }

  function paint(){

    const max = Math.max(0, maxStep());
    if(step<0) step=0;
    if(step>max) step=max;

    const dir = step>=lastStep ? 1 : -1;

    overlay.querySelectorAll("[data-wizard-step]").forEach(el=>{
      const on = Number(el.dataset.wizardStep)===step;
      el.hidden = !on;
      if(on && primed){
        el.style.setProperty("--wizard-dir", dir);
        el.classList.remove("wizard-enter");
        void el.offsetWidth;
        el.classList.add("wizard-enter");
      }
    });

    lastStep = step;
    primed = true;

    const info = titles()[step] || {};
    const title = overlay.querySelector("[data-wizard-heading]");
    const sub = overlay.querySelector("[data-wizard-sub]");
    if(title) title.textContent = info.title || "";
    if(sub) sub.textContent = info.sub || "";

    const dots = overlay.querySelector("[data-wizard-dots]");
    if(dots){
      dots.innerHTML = Array.from({length:max+1}, (_,i)=>
        `<i class="${i===step ? "on" : ""}"></i>`
      ).join("");
    }

    const back = overlay.querySelector("[data-wizard-back]");
    const next = overlay.querySelector("[data-wizard-next]");
    const save = overlay.querySelector("[data-wizard-save]");
    if(back){
      back.disabled = false;
      back.textContent = step===0 ? "Cancelar" : "Atrás";
    }
    if(next) next.hidden = step>=max;
    if(save) save.hidden = step<max;

  }

  overlay.addEventListener("click", event=>{
    if(event.target.closest("[data-wizard-next]")){
      event.preventDefault();
      if(options.validate && !options.validate(step)) return;
      step += 1;
      paint();
      return;
    }
    if(event.target.closest("[data-wizard-back]")){
      event.preventDefault();
      if(step===0){
        closeModal();
        return;
      }
      step -= 1;
      paint();
    }
  });

  overlay._wizardPaint = paint;
  paint();
  return { paint };

}


function bindBrandPicker(overlay){

  const nameInput = overlay.querySelector("#accountName");
  const paymentName = overlay.querySelector("#paymentName");
  const suggest = overlay.querySelector("#brandSuggest");
  const addBtn = overlay.querySelector("#brandAddApp");
  const picker = overlay.querySelector("#brandPicker");
  const search = overlay.querySelector("#brandSearch");
  const domain = overlay.querySelector("#brandDomain");
  const grid = overlay.querySelector("#brandGrid");

  if(!nameInput || !suggest) return;

  function currentType(){
    return overlay.querySelector("#accountType")?.value || "charges";
  }

  function setIcon(brand){

    overlay.querySelector("#iconSlug").value = brand.slug || "";
    overlay.querySelector("#iconHex").value = brand.hex || "";
    overlay.querySelector("#iconDomain").value = brand.domain || "";

    if(brand.title && !nameInput.value){
      nameInput.value = brand.title;
    }

    if(paymentName && brand.title && !paymentName.value){
      paymentName.value = brand.title;
    }

    suggest.innerHTML = `
      <button type="button" class="brand-hit" disabled>
        ${brandMiniHTML(brand)}
        <span>${escapeHTML(brand.title)}</span>
      </button>
    `;
    addBtn.style.display = "none";
    if(picker) picker.style.display = "none";
    hydrateOutlineIcons(suggest);

  }

  function renderHits(list, target){

    target.innerHTML = list.map(brand=>`

      <button
        type="button"
        class="brand-hit"
        data-slug="${escapeHTML(brand.slug||"")}"
        data-hex="${escapeHTML(brand.hex||"")}"
        data-domain="${escapeHTML(brand.domain||"")}"
        data-title="${escapeHTML(brand.title)}"
      >
        ${brandMiniHTML(brand)}
        <span>${escapeHTML(brand.title)}</span>
      </button>

    `).join("");

    hydrateOutlineIcons(target);

  }

  overlay.addEventListener("click", event=>{

    const hit = event.target.closest(".brand-hit[data-title]");
    if(!hit) return;

    setIcon({
      title: hit.dataset.title,
      slug: hit.dataset.slug,
      hex: hit.dataset.hex,
      domain: hit.dataset.domain
    });

    if(nameInput.value.trim()!==hit.dataset.title){
      nameInput.value = hit.dataset.title;
    }

  });

  nameInput.addEventListener("input", async()=>{

    const type = currentType();
    if(type!=="recurring" && type!=="subscription"){
      suggest.innerHTML = "";
      addBtn.style.display = "none";
      return;
    }

    await loadBrandCatalog();
    const q = nameInput.value.trim();
    const hits = searchBrands(q, 6);
    renderHits(hits, suggest);

    const exact = hits.some(brand=>
      brand.title.toLowerCase()===q.toLowerCase()
    );

    addBtn.style.display =
      q.length>=2 && !exact ? "" : "none";

    if(!q){
      overlay.querySelector("#iconSlug").value = "";
      overlay.querySelector("#iconHex").value = "";
      overlay.querySelector("#iconDomain").value = "";
    }

  });

  addBtn.addEventListener("click", async()=>{

    picker.style.display = "";
    search.value = nameInput.value.trim();
    await loadBrandCatalog();
    renderHits(searchBrands(search.value, 16), grid);

  });

  search?.addEventListener("input", ()=>{
    renderHits(searchBrands(search.value, 16), grid);
  });

  domain?.addEventListener("change", ()=>{

    const host = domain.value.trim()
      .replace(/^https?:\/\//,"")
      .replace(/\/.*$/,"");

    if(!host) return;

    setIcon({
      title: nameInput.value.trim() || host,
      slug: "",
      hex: "111111",
      domain: host
    });

  });

}

/* =========================================================
   ELIMINAR CUENTA
========================================================= */

function openDeleteAccountModal(
  accountId
){

  const account =
    getAccount(accountId);

  if(!account)
    return;

  const overlay =
    createModal(`

      <div class="modal-title">
        Eliminar cuenta
      </div>

      <div class="modal-subtitle">
        Se eliminarán también sus movimientos
        y pagos programados.
        Esta acción no se puede deshacer.
      </div>

      <div
        style="
          background:#f6f6f7;
          border-radius:17px;
          padding:16px;
          margin-bottom:18px;
          font-weight:700;
        "
      >
        ${escapeHTML(
          account.name
        )}
      </div>

      <div class="form-actions">

        <button
          type="button"
          class="btn-secondary"
          data-modal-cancel
        >
          Cancelar
        </button>

        <button
          type="button"
          class="btn-primary danger"
          id="confirmDeleteAccount"
        >
          Eliminar cuenta
        </button>

      </div>
  `);


  overlay
    .querySelector(
      "#confirmDeleteAccount"
    )
    .addEventListener(
      "click",
      async()=>{

        if(submitting)
          return;

        submitting=true;

        showLoading();

        try{

          const movementQuery =
            query(
              userCol("movements"),
              where(
                "accountId",
                "==",
                accountId
              )
            );

          const movementSnap =
            await getDocs(
              movementQuery
            );


          const scheduleQuery =
            query(
              userCol("scheduledPayments"),
              where(
                "accountId",
                "==",
                accountId
              )
            );

          const scheduleSnap =
            await getDocs(
              scheduleQuery
            );


          /*
            Firestore limita los batches a 500
            operaciones. Para una cuenta normal
            esto será más que suficiente, pero
            dividimos automáticamente si hubiera
            muchos movimientos.
          */

          const operations = [];

          movementSnap.forEach(
            item=>{
              operations.push(
                {
                  type:"delete",
                  ref:item.ref
                }
              );
            }
          );

          scheduleSnap.forEach(
            item=>{
              operations.push(
                {
                  type:"delete",
                  ref:item.ref
                }
              );
            }
          );

          operations.push({
            type:"delete",
            ref:userDoc(
              "accounts",
              accountId
            )
          });


          for(
            let i=0;
            i<operations.length;
            i+=450
          ){

            const batch =
              writeBatch(db);

            operations
              .slice(i,i+450)
              .forEach(
                operation=>{
                  batch.delete(
                    operation.ref
                  );
                }
              );

            await batch.commit();

          }


          if(
            selectedIndex>=
            accounts.length-1
          ){

            selectedIndex =
              Math.max(
                0,
                accounts.length-2
              );

          }


          closeModal();

          showToast(
            "Cuenta eliminada"
          );

        }
        catch(error){

          console.error(error);

          showToast(
            error.message ||
            "No se pudo eliminar la cuenta"
          );

        }
        finally{

          submitting=false;

          hideLoading();

        }

      }
    );

}

async function persistAccountOrder(){

  const batch = writeBatch(db);

  accounts.forEach((account,index)=>{
    account.sortOrder = index;
    batch.update(
      userDoc("accounts",account.id),
      {sortOrder:index}
    );
  });

  await batch.commit();

}


async function moveAccount(accountId,dir){

  const from =
    accounts.findIndex(
      account=>account.id===accountId
    );

  const to = from + dir;

  if(
    from<0 ||
    to<0 ||
    to>=accounts.length
  ){
    return;
  }

  const selectedId =
    getSelectedAccount()?.id;

  const copy = accounts.slice();
  const [row] = copy.splice(from,1);
  copy.splice(to,0,row);
  accounts = copy;

  if(selectedId){
    const next =
      accounts.findIndex(
        account=>account.id===selectedId
      );
    if(next>=0) selectedIndex = next;
  }

  refreshOrganizeList();
  renderAppOnly();

  try{
    await persistAccountOrder();
  }
  catch(error){
    console.error(error);
    showToast("No se pudo guardar el orden");
  }

}

    savePatch({ cardColor: hex });
  });

  overlay.querySelector("#styleVisible").addEventListener("click", ()=>{
    const next = !account.hiddenFromHome;
    account.hiddenFromHome = next;
    const sw = overlay.querySelector("#styleVisible .switch");
    if(sw) sw.classList.toggle("on", !next);
    savePatch({ hiddenFromHome: next });
  });

  overlay.querySelector("#styleEdit").addEventListener("click", ()=>{
    closeModal();
    openEditAccountModal(accountId);
  });

  overlay.querySelector("#styleDelete").addEventListener("click", ()=>{
    closeModal();
    openDeleteAccountModal(accountId);
  });

  const hits = overlay.querySelector("#styleIconHits");
  const search = overlay.querySelector("#styleIconSearch");

  search.addEventListener("focus", ()=>loadBrandCatalog());
  search.addEventListener("input", async()=>{
    await loadBrandCatalog();
    const list = searchBrands(search.value, 6);
    hits.innerHTML = list.map(brand=>`

      <button
        type="button"
        class="brand-hit"
        data-slug="${escapeHTML(brand.slug||"")}"
        data-hex="${escapeHTML(brand.hex||"")}"
        data-domain="${escapeHTML(brand.domain||"")}"
        data-title="${escapeHTML(brand.title)}"
      >
        ${brandMiniHTML(brand)}
        <span>${escapeHTML(brand.title)}</span>
      </button>

    `).join("");
    hydrateOutlineIcons(hits);
  });

  hits.addEventListener("click", event=>{
    const hit = event.target.closest(".brand-hit[data-title]");
    if(!hit) return;
    savePatch({
      iconSlug: hit.dataset.slug || "",
      iconHex: hit.dataset.hex || "",
      iconDomain: hit.dataset.domain || ""
    });
    showToast("Icono actualizado");
  });

  overlay.querySelector("#styleIconDomain").addEventListener("change", event=>{
    const host = event.target.value.trim()
      .replace(/^https?:\/\//,"")
      .replace(/\/.*$/,"");
    savePatch({
      iconSlug: "",
      iconHex: "111111",
      iconDomain: host
    });
  });

function openHomeCardsModal(){

  if(!accounts.length){
    showToast("Aún no hay cuentas");
    return;
  }

  const overlay = createModal(`

    <div class="modal-title">Tarjetas del inicio</div>
    <div class="modal-subtitle">
      Elige cuáles se ven y su color
    </div>

    ${
      accounts.map(account=>{

        const color = String(account.cardColor||"").replace("#","") || "242428";

        return `
          <div class="home-card-edit">
            <div class="settings-row">
              <div>
                <strong>${escapeHTML(account.name)}</strong>
              </div>
              <button
                type="button"
                class="switch ${account.hiddenFromHome ? "" : "on"}"
                data-home-visible="${account.id}"
                aria-label="Visible"
              ><i></i></button>
            </div>
            <div class="color-row" data-color-account="${account.id}">
              ${colorDotsHTML(color)}
            </div>
          </div>
        `;

      }).join("")
    }

    <div class="form-actions">
      <button type="button" class="btn-secondary" data-modal-cancel style="width:100%">
        Listo
      </button>
    </div>
  `);

  overlay.addEventListener("click", async event=>{

    const vis = event.target.closest("[data-home-visible]");
    if(vis){
      const id = vis.dataset.homeVisible;
      const account = getAccount(id);
      if(!account) return;
      const next = !account.hiddenFromHome;
      account.hiddenFromHome = next;
      vis.classList.toggle("on", !next);
      try{
        await updateDoc(userDoc("accounts",id),{ hiddenFromHome: next });
      }
      catch(error){
        showToast("No se pudo guardar");
      }
      return;
    }

    const color = event.target.closest("[data-color]");
    if(color && color.closest("[data-color-account]")){
      const id = color.closest("[data-color-account]").dataset.colorAccount;
      const row = color.closest("[data-color-account]");
      row.querySelectorAll("[data-color], .color-custom").forEach(item=>
        item.classList.toggle("on", item===color)
      );
      try{
        await updateDoc(
          userDoc("accounts",id),
          { cardColor: color.dataset.color }
        );
      }
      catch(error){
        showToast("No se pudo guardar");
      }
      return;
    }

    const custom = event.target.closest("[data-custom-color]");
    if(custom){
      return;
    }

  });

  overlay.querySelectorAll("[data-custom-color]").forEach(input=>{
    input.addEventListener("input", async event=>{
      const hex = String(event.target.value||"").replace("#","");
      if(!/^[0-9a-fA-F]{6}$/.test(hex)) return;
      const row = input.closest("[data-color-account]");
      const id = row?.dataset.colorAccount;
      if(!id) return;
      row.querySelectorAll("[data-color]").forEach(item=>item.classList.remove("on"));
      input.closest(".color-custom")?.classList.add("on");
      try{
        await updateDoc(userDoc("accounts",id),{ cardColor: hex });
      }
      catch(error){
        showToast("No se pudo guardar");
      }
    });
  });

}

function openEditAccountModal(

  }

  const d =

  const localDate =
    new Date(

    )

  const overlay =
    createModal(`

              payment.name || ""
            )}"
          >

        </div>

        <div class="field">

          <label>
            Monto
          </label>

          <input
            id="editPaymentAmount"
            inputmode="decimal"
            value="${formatMoneyInput(Number(payment.amount||0))}"
            required
          >

        </div>

        <div class="field">

          <label>
            Frecuencia
          </label>

          <select id="editFrequency">

            ${Object.entries(
              frequencies
            ).map(
              ([key,value])=>`

                <option
                  value="${key}"
                  ${
                    payment.frequency===key
                    ? "selected"
                    : ""
                  }
                >
                  ${value.label}
                </option>

              `
            ).join("")}

          </select>

        </div>

        <div class="field">

          <label>
            Próximo pago
          </label>

          <input
            id="editNextPayment"
            type="date"
            value="${localDate}"
            required
          >

        </div>

        <div class="form-actions">

          <button
            type="button"
            class="btn-secondary"
            data-modal-cancel
          >
            Cancelar
          </button>

          <button
            type="submit"
            class="btn-primary"
          >
            Guardar
          </button>

        </div>

      </form>
  `);


  bindMoneyInput(overlay.querySelector("#editPaymentAmount"));

  overlay
    .querySelector(
      "#editRecurringForm"
    )
    .addEventListener(
      "submit",
      async event=>{

        event.preventDefault();

        if(submitting)
          return;

        const newName =
          overlay
            .querySelector(
              "#editAccountName"
            ).value.trim();

        const paymentName =
          overlay
            .querySelector(
              "#editPaymentName"
            ).value.trim();

        const amount =
          parseMoneyInput(
            overlay
              .querySelector(
                "#editPaymentAmount"
              ).value
          );

        const frequency =
          overlay
            .querySelector(
              "#editFrequency"
            ).value;

        const dateString =
          overlay
            .querySelector(
              "#editNextPayment"
            ).value;

        if(!newName){

          showToast(
            "Escribe un nombre"
          );

          return;

        }

        if(!amount || amount<=0){

          showToast(
            "Escribe un monto válido"
          );

          return;

        }

        if(!dateString){

          showToast(
            "Selecciona una fecha"
          );

          return;

        }

        submitting=true;

        showLoading();

        try{

          const nextDate =
            new Date(
              dateString+
              "T12:00:00"
            );

          await updateDoc(
            userDoc(
              "accounts",
              accountId

            {
              name:newName

          );


          await updateDoc(
            userDoc(
              "scheduledPayments",
              payment.id
            ),
            {
              name:
                paymentName ||
                newName,

              amount,

              frequency,

              nextPayment:
                Timestamp.fromDate(
                  nextDate

            }
          );


          closeModal();

          showToast(
            "Cambios guardados"
          );

        }
        catch(error){

          console.error(error);

          showToast(
            error.message ||
            "No se pudieron guardar los cambios"
          );

        }
        finally{

          submitting=false;

          hideLoading();

        }

      }
    );

function openDeferStudio(paymentId){

  const payment = paymentId
    ? scheduledPayments.find(item=>item.id===paymentId)
    : null;

  if(paymentId && !payment){
    showToast("No se encontró el pago");
    return;
  }

  const units = [
    ["week","Semanas"],
    ["fortnight","Quincenas"],
    ["month","Meses"]
  ];
  const counts = [2,3,4,6,8,12];
  let unit = payment?.splitUnit || "fortnight";
  let parts = Math.max(2, Number(payment?.splitParts)||Number(payment?.splitQuincenas)||2);

  const dueValue = payment ? dateValue(payment.nextPayment) : null;
  const dueInput = dueValue
    ? dueValue.toISOString().slice(0,10)
    : "";

  const overlay = createModal(`
    <div class="modal-title">Diferir</div>
    <div class="modal-subtitle">
      ${
        payment
        ? `${escapeHTML(payment.name || "Pago")} · ${money(payment.amount)}`
        : "Una cantidad, para juntarla antes de la fecha."
      }
    </div>
    ${
      payment ? "" : `
        <div class="field">
          <label>Nombre</label>
          <input id="deferName" placeholder="Tenencia, viaje, renta...">
        </div>
        <div class="field">
          <label>Cantidad</label>
          <input id="deferAmount" inputmode="decimal" placeholder="0.00">
        </div>
        <div class="field">
          <label>¿Cuándo lo tienes que pagar?</label>
          <input id="deferDate" type="date" value="${dueInput}">
        </div>
      `
    }
    <div class="field">
      <label>¿Cada cuánto apartas?</label>
      <div class="split-options" id="deferUnits">
        ${units.map(([key,label])=>`
          <button type="button" class="split-option ${key===unit?"active":""}" data-unit="${key}">${label}</button>
        `).join("")}
      </div>
    </div>
    <div class="field">
      <label>¿En cuántos pagos?</label>
      <div class="split-options" id="deferCounts">
        ${counts.map(value=>`
          <button type="button" class="split-option ${value===parts?"active":""}" data-count="${value}">${value}</button>
        `).join("")}
      </div>
    </div>
    <div class="plan-preview" id="deferPreview"></div>
    <div class="form-actions">
      <button type="button" class="btn-secondary" data-modal-cancel>Cancelar</button>
      <button type="button" class="btn-primary" id="saveDefer">Guardar</button>
    </div>
  `);

  function currentAmount(){
    if(payment) return Number(payment.amount)||0;
    return parseMoneyInput(overlay.querySelector("#deferAmount")?.value);
  }

  function currentDue(){
    if(payment) return dateValue(payment.nextPayment);
    const value = overlay.querySelector("#deferDate")?.value;
    return value ? new Date(value+"T12:00:00") : null;
  }

  function refresh(){
    const rows = deferPlan(currentAmount(), currentDue(), parts, unit);
    const box = overlay.querySelector("#deferPreview");
    if(!rows.length){
      box.innerHTML = `<div><span>Escribe la cantidad y la fecha</span></div>`;
      return;
    }
    const past = deferStartsInPast(rows);
    box.innerHTML = `
      ${past ? `<div><span>Eso empezaría antes de hoy. Elige menos pagos.</span></div>` : ""}
      ${rows.map(row=>`
        <div>
          <span>${formatShortDate(row.date)}${row.last ? " · se paga" : " · apartar"}</span>
          <strong>${money(row.amount)}</strong>
        </div>
      `).join("")}
    `;
  }

  overlay.querySelectorAll("[data-unit]").forEach(button=>{
    button.addEventListener("click", ()=>{
      unit = button.dataset.unit;
      overlay.querySelectorAll("[data-unit]").forEach(item=>{
        item.classList.toggle("active", item===button);
      });
      refresh();
    });
  });

  overlay.querySelectorAll("[data-count]").forEach(button=>{
    button.addEventListener("click", ()=>{
      parts = Number(button.dataset.count);
      overlay.querySelectorAll("[data-count]").forEach(item=>{
        item.classList.toggle("active", item===button);
      });
      refresh();
    });
  });

  bindMoneyInput(overlay.querySelector("#deferAmount"));
  overlay.querySelector("#deferAmount")?.addEventListener("input", refresh);
  overlay.querySelector("#deferDate")?.addEventListener("change", refresh);
  refresh();

  overlay.querySelector("#saveDefer").addEventListener("click", async()=>{
    if(submitting) return;
    const amount = currentAmount();
    const due = currentDue();
    const rows = deferPlan(amount, due, parts, unit);
    if(!amount || !due || !rows.length){
      showToast("Falta la cantidad o la fecha");
      return;
    }
    if(deferStartsInPast(rows)){
      showToast("Eso empezaría antes de hoy");
      return;
    }
    const name = payment
      ? (payment.name || "Pago")
      : String(overlay.querySelector("#deferName")?.value||"").trim();
    if(!payment && !name){
      showToast("Ponle un nombre");
      return;
    }

    submitting = true;
    showLoading();
    try{
      const patch = {
        splitParts: parts,
        splitUnit: unit,
        splitQuincenas: unit==="fortnight" ? parts : 1
      };
      if(payment){
        await updateDoc(userDoc("scheduledPayments", payment.id), patch);
      }else{
        const account = accounts[0];
        await addDoc(userCol("scheduledPayments"), {
          accountId: account?.id || "",
          name,
          amount,
          frequency: "annual",
          customDays: 30,
          nextPayment: Timestamp.fromDate(due),
          active: true,
          kind: "payment",
          isSubscription: false,
          deferCustom: true,
          ...patch,
          createdAt: serverTimestamp()
        });
      }
      closeModal();
      showToast(`Aparta ${money(amount/parts)} en cada pago`);
    }catch(error){
      console.error(error);
      showToast("No se pudo guardar");
    }
    submitting = false;
    hideLoading();
  });

}


function openDeferPaymentModal(

      item=>item.id===paymentId
    );

  if(!payment){

    showToast(

  if(!canDeferPayment(payment)){

  const account =

  const overlay =
    createModal(`

  overlay
    .querySelector("#saveSplit")
    .addEventListener(
      "click",
      async()=>{

        if(submitting)
          return;

        submitting=true;

        showLoading();

        try{

          await updateDoc(
            userDoc(
              "scheduledPayments",
              payment.id
            ),
            {
              splitQuincenas:
                selectedSplit
            }
          );

          closeModal();

          showToast(
            selectedSplit===1
            ? "Se pagará completo cuando toque"
            : `Lo juntas en ${selectedSplit} quincenas`
          );

        }
        catch(error){

          console.error(error);

          showToast(
            error.message ||
            "No se pudo guardar el plan"
          );

        }
        finally{

          submitting=false;

          hideLoading();

        }

      }
    );

}


/* =========================================================
   FAB
========================================================= */

fab.addEventListener(
  "click",
  event=>{

    event.preventDefault();

    openQuickMovementModal();

  }
);


/* =========================================================
   CERRAR MODAL CON ESC
========================================================= */

document.addEventListener(
  "keydown",
  event=>{

    if(
      event.key==="Escape" &&
      document.querySelector(
        ".overlay"
      )
    ){

      closeModal();

    }

  }
);


/* =========================================================
   BLOQUEAR ZOOM ACCIDENTAL
========================================================= */

document.addEventListener(
  "gesturestart",
  event=>{
    event.preventDefault();
  },
  {passive:false}
);

document.addEventListener(
  "gesturechange",
  event=>{
    event.preventDefault();
  },
  {passive:false}
);

document.addEventListener(
  "gestureend",
  event=>{
    event.preventDefault();
  },
  {passive:false}
);


/*
  Evita el gesto de doble toque que puede
  provocar zoom en algunos navegadores.
*/

let lastTouchEnd=0;

document.addEventListener(
  "touchend",
  event=>{

    const now =
      Date.now();

    if(
      now-lastTouchEnd<=300
    ){

      event.preventDefault();

    }

    lastTouchEnd=now;

  },
  {passive:false}
);


/* =========================================================
   INICIO
========================================================= */

/* La app espera onAuthStateChanged antes de cargar datos. */


/* =========================================================
   ERROR GLOBAL DEL MÓDULO
========================================================= */

window.addEventListener(
  "error",
  event=>{

    console.error(
      "Error JavaScript:",
      event.error || event.message
    );

  }
);

window.addEventListener(
  "unhandledrejection",
  event=>{

    console.error(
      "Promise rechazada:",
      event.reason
    );

  }
);

</script>
