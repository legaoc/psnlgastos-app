function upcomingChargeDue(dueDay,fromDate){

  const day = Number(dueDay)||0;

  if(day<1) return null;

  const start = startOfDay(fromDate);

  if(!start) return null;

  for(let i=0;i<62;i++){

    const cursor =
      new Date(
        start.getFullYear(),
        start.getMonth(),
        start.getDate()+i
      );

    const last =
      lastDayOfMonth(
        cursor.getFullYear(),
        cursor.getMonth()
      );

    if(cursor.getDate()===Math.min(day,last)){
      return cursor;
    }

  }

  return null;

}


function lastChargeDue(dueDay,fromDate){

  const day = Number(dueDay)||0;

  if(day<1) return null;

  const start = startOfDay(fromDate);

  if(!start) return null;

  for(let i=1;i<=62;i++){

    const cursor =
      new Date(
        start.getFullYear(),
        start.getMonth(),
        start.getDate()-i
      );

    const last =
      lastDayOfMonth(
        cursor.getFullYear(),
        cursor.getMonth()
      );

    if(cursor.getDate()===Math.min(day,last)){
      return cursor;
    }

  }

  return null;

}


function resolveChargeDue(account,context){

  const dueDay = Number(account.dueDay)||0;

  if(dueDay<1) return null;

  const today = startOfDay(new Date());
  const last = lastChargeDue(dueDay,today);
  const upcoming = upcomingChargeDue(dueDay,today);

  if(
    last &&
    windowContains(context.current,last)
  ){

    return {
      due:last,
      overdue:true,
      targetWindow:context.current
    };

  }

  if(!upcoming) return null;

  const index =
    findWindowIndex(
      context.windows,
      upcoming
    );

  if(index<0) return null;

  return {
    due:upcoming,
    overdue:false,
    targetWindow:context.windows[index]
  };

}


function buildQuincenaPlan(window,context){

  if(!window){

    return {
      window,
      items:[],
      fromPayroll:0,
      toPay:0,
      toSetAside:0
    };

  }

  const today = startOfDay(new Date());
  const grouped = new Map();

  scheduledPayments.forEach(payment=>{

    const account =
      getAccount(payment.accountId);

    if(!account) return;

    const amount =
      Number(payment.amount||0);

    if(amount<=0) return;

    const split =
      getSplitCount(payment);

    const dates =
      occurrenceDates(
        payment,
        context.windows[
          context.windows.length-1
        ].end
      );

    dates.forEach(due=>{

      const dueIndex =
        findWindowIndex(
          context.windows,
          due
        );

      if(dueIndex<0) return;

      const overdue =
        startOfDay(due)<today;

      const dueWindow =
        context.windows[dueIndex];

      const isDueHere =
        windowContains(window,due) ||
        (
          overdue &&
          window===context.current
        );

      if(overdue && window!==context.current){
        return;
      }

      const contributing = [];

      if(overdue){

        contributing.push(
          context.currentIndex
        );

      }
      else{

        const startIndex =
          Math.max(
            context.currentIndex,
            dueIndex-(split-1)
          );

        for(
          let i=startIndex;
          i<=dueIndex;
          i++
        ){
          contributing.push(i);
        }

      }

      const windowIndex =
        context.windows.indexOf(window);

      if(
        !contributing.includes(
          windowIndex
        )
      ){
        return;
      }

      const share =
        amount /
        contributing.length;

      const key = isDueHere
        ? `${payment.id}:${startOfDay(due).getTime()}`
        : payment.id;

      const currentItem =
        grouped.get(key) || {
          payment,
          account,
          amount:0,
          share:0,
          isDue:false,
          overdue:false,
          due:due,
          split:contributing.length,
          installment:
            contributing.indexOf(
              windowIndex
            )+1,
          count:0,
          dueCount:0,
          unitAmount:amount,
          occurrenceIndex:1,
          occurrenceTotal:1,
          kind:"recurring"
        };

      currentItem.share += share;
      currentItem.count += 1;
      currentItem.unitAmount = amount;
      currentItem.split = contributing.length;
      currentItem.installment =
        contributing.indexOf(
          windowIndex
        )+1;

      if(isDueHere){

        currentItem.isDue = true;
        currentItem.amount += amount;
        currentItem.dueCount += 1;
        currentItem.due = due;

        if(overdue){
          currentItem.overdue = true;
        }

      }
      else if(!currentItem.isDue){

        currentItem.due = due;
        currentItem.amount = amount;

      }

      grouped.set(key,currentItem);

    });

  });

  accounts.forEach(account=>{

    if(account.type!=="charges")
      return;

    const balance =
      Number(account.balance||0);

    if(balance<=0)
      return;

    const resolved =
      resolveChargeDue(
        account,
        context
      );

    if(!resolved)
      return;

    if(resolved.targetWindow!==window)
      return;

    grouped.set(
      "charge:"+account.id,
      {
        payment:{
          id:"charge-"+account.id,
          name:account.name,
          accountId:account.id,
          amount:balance
        },
        account,
        amount:balance,
        share:balance,
        isDue:true,
        overdue:resolved.overdue,
        due:resolved.due,
        split:1,
        installment:1,
        count:1,
        dueCount:1,
        unitAmount:balance,
        occurrenceIndex:1,
        occurrenceTotal:1,
        kind:"charges"
      }
    );

  });

  const items =
    [...grouped.values()];

  const dueByPayment = {};

  items.forEach(item=>{

    if(!item.isDue || item.kind==="charges")
      return;

    const id = item.payment.id;
    (dueByPayment[id] ||= []).push(item);

  });

  Object.values(dueByPayment).forEach(list=>{

    list.sort((a,b)=>{
      const da = startOfDay(a.due)?.getTime()||0;
      const db = startOfDay(b.due)?.getTime()||0;
      return da-db;
    });

    list.forEach((item,index)=>{
      item.occurrenceIndex = index+1;
      item.occurrenceTotal = list.length;
      item.dueCount = 1;
    });

  });

  items.sort((a,b)=>{

        if(a.isDue!==b.isDue){
          return a.isDue?-1:1;
        }

        const da =
          startOfDay(a.due)?.getTime()||0;

        const db =
          startOfDay(b.due)?.getTime()||0;

        return da-db;

      });

  const toPay =
    items
      .filter(item=>item.isDue)
      .reduce(
        (sum,item)=>sum+item.amount,
        0
      );

  const fromPayroll =
    items.reduce(
      (sum,item)=>sum+item.share,
      0
    );

  const toSetAside =
    items
      .filter(item=>!item.isDue)
      .reduce(
        (sum,item)=>sum+item.share,
        0
      );

  return {
    window,
    items,
    fromPayroll,
    toPay,
    toSetAside
  };

}


function getQuincenaPlans(){

  const context =
    getCurrentAndNextWindows();

  return {
    current:buildQuincenaPlan(
      context.current,
      context
    ),
    next:buildQuincenaPlan(
      context.next,
      context
    ),
    context
  };

}


function startOfMonth(value){

  const date = startOfDay(value)||startOfDay(new Date());

  return new Date(
    date.getFullYear(),
    date.getMonth(),
    1
  );

}


function monthPayWindows(monthDate){

  const month = startOfMonth(monthDate);
  const windows = getQuincenaWindows(month);

  return windows.filter(window=>{
    const payday = startOfDay(window.payday);
    return payday &&
      payday.getFullYear()===month.getFullYear() &&
      payday.getMonth()===month.getMonth();
  });

}


function saveIndexesForDue(due,context,today){

  const day = startOfDay(due);

  if(!day) return [];

  if(day<today){
    return [context.currentIndex];
  }

  const dueIndex =
    findWindowIndex(context.windows, day);

  if(dueIndex<0) return [];

  if(dueIndex===0) return [0];

  return [dueIndex-1, dueIndex];

}


function buildSavePlan(window,context){

  if(!window){
    return {
      window,
      items:[],
      total:0,
      isCurrent:false
    };
  }

  const today = startOfDay(new Date());
  const windowIndex = context.windows.findIndex(item=>{
    return startOfDay(item.payday)?.getTime() ===
      startOfDay(window.payday)?.getTime();
  });
  if(windowIndex<0){
    return { window, items:[], total:0, isCurrent:false };
  }
  const grouped = new Map();

  scheduledPayments.forEach(payment=>{

    const account = getAccount(payment.accountId);
    if(!account) return;

    const amount = Number(payment.amount||0);
    if(amount<=0) return;

    const dates = occurrenceDates(
      payment,
      context.windows[context.windows.length-1].end
    );

    dates.forEach(due=>{

      const indexes = saveIndexesForDue(due,context,today);
      if(!indexes.includes(windowIndex)) return;

      const share = amount / indexes.length;
      const dueDay = startOfDay(due);
      const key = payment.id+":"+dueDay.getTime();
      const lastIndex = indexes[indexes.length-1];

      grouped.set(key,{
        name: payment.name || account.name,
        amount,
        share,
        due: dueDay,
        part: indexes.indexOf(windowIndex)+1,
        parts: indexes.length,
        isDue: windowIndex===lastIndex,
        overdue: dueDay<today,
        accountId: account.id
      });

    });

  });

  accounts.forEach(account=>{

    if(account.type!=="charges") return;

    const balance = Number(account.balance||0);
    if(balance<=0) return;

    const due = upcomingChargeDue(account.dueDay, today);
    if(!due) return;

    const indexes = saveIndexesForDue(due,context,today);
    if(!indexes.includes(windowIndex)) return;

    const share = balance / indexes.length;
    const lastIndex = indexes[indexes.length-1];

    grouped.set("charge:"+account.id,{
      name: account.name,
      amount: balance,
      share,
      due: startOfDay(due),
      part: indexes.indexOf(windowIndex)+1,
      parts: indexes.length,
      isDue: windowIndex===lastIndex,
      overdue: startOfDay(due)<today,
      accountId: account.id
    });

  });

  const items = [...grouped.values()].sort((a,b)=>{
    const da = a.due?.getTime()||0;
    const db = b.due?.getTime()||0;
    return da-db || a.name.localeCompare(b.name);
  });

  const total = items.reduce((sum,item)=>sum+Number(item.share||0),0);

  return {
    window,
    items,
    total,
    isCurrent: windowContains(window, today)
  };

}


function getMonthSavePlans(monthDate=quincenaMonth){

  const month = startOfMonth(monthDate);
  const context = getCurrentAndNextWindows(month);
  const windows = monthPayWindows(month);

  const plans = windows.map(window=>
    buildSavePlan(window, context)
  );

  return {
    month,
    plans,
    total: plans.reduce((sum,plan)=>sum+plan.total,0),
    context
  };

}


function eventCategory(item){

  if(item.kind==="charges") return "charges";

  if(
    item.kind==="subscription" ||
    item.isSubscription
  ) return "subs";

  const freq = item.frequency;

  if(freq==="weekly" || freq==="every15")
    return "weekly";

  return "subs";

}


function occurrencesInRange(payment,from,until){

  const start = dateValue(payment.nextPayment);
  if(!start) return [];

  const fromDay = startOfDay(from);
  const untilDay = startOfDay(until);
  const seen = new Set();
  const dates = [];

  function add(value){
    const day = startOfDay(value);
    if(!day || day<fromDay || day>=untilDay) return;
    const key = day.getTime();
    if(seen.has(key)) return;
    seen.add(key);
    dates.push(day);
  }

  let cursor = new Date(start);
  let guard = 0;
  while(guard<40){
    add(cursor);
    cursor = prevOccurrence(
      cursor,
      payment.frequency,
      payment.customDays
    );
    if(startOfDay(cursor)<fromDay) break;
    guard++;
  }

  cursor = nextOccurrence(
    start,
    payment.frequency,
    payment.customDays
  );
  guard = 0;
  while(startOfDay(cursor)<untilDay && guard<40){
    add(cursor);
    cursor = nextOccurrence(
      cursor,
      payment.frequency,
      payment.customDays
    );
    guard++;
  }

  return dates.sort((a,b)=>a-b);

}


function accountDotColor(account){

  const hex = String(account?.cardColor||"").replace("#","");
  if(/^[0-9a-fA-F]{6}$/.test(hex)) return "#"+hex;
  return account?.type==="recurring" ? "#5c5c66" : "#2a2a30";

}


function renderDayDots(events){

  const seen = new Set();
  const colors = [];

  (events||[]).forEach(event=>{
    const id = event.accountId || event.key;
    if(seen.has(id)) return;
    seen.add(id);
    colors.push(event.color || accountDotColor(getAccount(event.accountId)));
  });

  if(!colors.length) return "";

  const overflow = colors.length>=5;
  const shown = overflow ? colors.slice(0,3) : colors.slice(0,4);

  return shown.map(color=>`
      <i class="cal-dot" style="background:${color}"></i>
    `).join("") +
    (overflow ? `<i class="cal-dot-more">+</i>` : "");

}


function getCalendarEvents(monthDate,category){

  const month = startOfMonth(monthDate);
  const next = new Date(month.getFullYear(), month.getMonth()+1, 1);
  const events = [];

  scheduledPayments.forEach(payment=>{

    const account = getAccount(payment.accountId);
    if(!account) return;

    const cat = eventCategory({
      frequency: payment.frequency,
      kind: payment.kind,
      isSubscription: payment.isSubscription
    });

    if(category!=="all" && category!==cat) return;

    occurrencesInRange(payment, month, next).forEach(due=>{
      events.push({
        key: payment.id+":"+due.getTime(),
        name: payment.name || account.name,
        amount: Number(payment.amount||0),
        due,
        category: cat,
        accountId: account.id,
        color: accountDotColor(account),
        kind: "recurring"
      });
    });

  });

  if(category==="all" || category==="charges"){

    accounts.forEach(account=>{

      if(account.type!=="charges") return;
      if(!account.dueDay) return;

      let cursor = new Date(month);
      for(let i=0;i<3;i++){
        const due = upcomingChargeDue(account.dueDay, cursor);
        if(!due) break;
        if(due>=month && due<next){
          events.push({
            key: "charge:"+account.id+":"+due.getTime(),
            name: account.name,
            amount: Number(account.balance||0),
            due: startOfDay(due),
            category: "charges",
            accountId: account.id,
            color: accountDotColor(account),
            kind: "charges"
          });
          break;
        }
        cursor = new Date(due.getTime()+86400000);
      }

    });

  }

  return events.sort((a,b)=>a.due-b.due || a.name.localeCompare(b.name));

}


function nextCalendarPayment(fromDate, category){

  const start = startOfDay(fromDate) || startOfDay(new Date());
  const thisMonth = startOfMonth(start);
  const nextMonth = new Date(thisMonth.getFullYear(), thisMonth.getMonth()+1, 1);
  const list = getCalendarEvents(thisMonth, category)
    .concat(getCalendarEvents(nextMonth, category))
    .filter(event=>startOfDay(event.due)>start)
    .sort((a,b)=>a.due-b.due);

  return list[0] || null;

}


function renderCalendar(){

  const month = startOfMonth(calendarMonth);
  const monthLabel = new Intl.DateTimeFormat("es-MX",{
    month:"long",
    year:"numeric"
  }).format(month);

  const events = getCalendarEvents(month, calendarCategory);
  const byDay = {};

  events.forEach(event=>{
    const day = event.due.getDate();
    (byDay[day] ||= []).push(event);
  });

  const cats = [
    ["all","Todas"],
    ["subs","Subscripciones"],
    ["weekly","Semanales"],
    ["charges","Cargos"]
  ];

  const counts = {
    all: getCalendarEvents(month,"all").length,
    subs: getCalendarEvents(month,"subs").length,
    weekly: getCalendarEvents(month,"weekly").length,
    charges: getCalendarEvents(month,"charges").length
  };

  const firstDow = (new Date(month.getFullYear(), month.getMonth(), 1).getDay()+6)%7;
  const daysInMonth = new Date(month.getFullYear(), month.getMonth()+1, 0).getDate();
  const today = startOfDay(new Date());
  const selectedKey = calendarSelected || (
    today.getFullYear()===month.getFullYear() &&
    today.getMonth()===month.getMonth()
      ? String(today.getDate())
      : null
  );

  const cells = [];
  for(let i=0;i<firstDow;i++){
    cells.push({ empty:true });
  }
  for(let day=1;day<=daysInMonth;day++){
    cells.push({ day, events: byDay[day]||[] });
  }
  while(cells.length%7){
    cells.push({ empty:true });
  }

  const selectedEvents = selectedKey
    ? (byDay[Number(selectedKey)]||[])
    : [];

  const todayInMonth =
    today.getFullYear()===month.getFullYear() &&
    today.getMonth()===month.getMonth();
  const todayEvents = todayInMonth ? (byDay[today.getDate()]||[]) : [];
  const nextEvent = todayEvents.length
    ? null
    : nextCalendarPayment(today, calendarCategory);
  const nextDay =
    nextEvent &&
    nextEvent.due.getFullYear()===month.getFullYear() &&
    nextEvent.due.getMonth()===month.getMonth()
      ? nextEvent.due.getDate()
      : null;

  const weekdays = ["L","M","M","J","V","S","D"];

  return `
    <section class="finance-hero">
      <div class="month-nav">
        <button
          type="button"
          data-action="calendar-month"
          data-dir="-1"
          aria-label="Mes anterior"
        >‹</button>
        <div class="month-title">${monthLabel}</div>
        <button
          type="button"
          data-action="calendar-month"
          data-dir="1"
          aria-label="Mes siguiente"
        >›</button>
      </div>

      <div class="cat-row">
        ${
          cats.map(([id,label])=>`

            <button
              type="button"
              class="cat-chip ${
                calendarCategory===id ? "active" : ""
              }"
              data-action="calendar-cat"
              data-cat="${id}"
            >
              ${label}<b>${counts[id]}</b>
            </button>

          `).join("")
        }
      </div>
    </section>

    <section class="finance-card">
      <div class="cal-grid">
        ${
          weekdays.map(name=>`
            <div class="cal-dow">${name}</div>
          `).join("")
        }
        ${
          cells.map(cell=>{

            if(cell.empty){
              return `<div></div>`;
            }

            const date = new Date(
              month.getFullYear(),
              month.getMonth(),
              cell.day
            );
            const isToday =
              startOfDay(date)?.getTime()===today.getTime();
            const isSelected =
              String(cell.day)===String(selectedKey);
            const isNext = nextDay===cell.day;

            return `
              <button
                type="button"
                class="cal-day ${
                  isToday ? "is-today" : ""
                } ${
                  isSelected ? "is-selected" : ""
                } ${
                  isNext ? "is-next" : ""
                }"
                data-action="calendar-day"
                data-day="${cell.day}"
              >
                <span class="n">${cell.day}</span>
                <span class="cal-dots">
                  ${renderDayDots(cell.events)}
                </span>
              </button>
            `;

          }).join("")
        }
      </div>
    </section>

    <section class="finance-card">
      <h3>
        ${
          selectedKey
          ? "Pagos del "+selectedKey
          : "Elige un día"
        }
      </h3>
      ${
        selectedEvents.length
        ? selectedEvents.map(event=>`

          <div class="month-q-row">
            <div>
              <b>${escapeHTML(event.name)}</b>
              <span>
                ${
                  event.category==="subs"
                  ? "Subscripción"
                  : event.category==="weekly"
                  ? "Pago semanal"
                  : "Cargo"
                }
              </span>
            </div>
            <strong>${money(event.amount)}</strong>
          </div>

        `).join("")
        : selectedKey && todayInMonth && Number(selectedKey)===today.getDate()
        ? `
          <div class="no-data">Sin pago en ese día.</div>
          ${
            nextEvent
            ? `<div class="cal-next-hint">
                Próximo pago: ${
                  new Intl.DateTimeFormat("es-MX",{
                    day:"numeric",
                    month:"short"
                  }).format(nextEvent.due)
                } · ${escapeHTML(nextEvent.name)} · ${money(nextEvent.amount)}
              </div>`
            : ""
          }
        `
        : `<div class="no-data">No hay pagos este día.</div>`
      }
    </section>
  `;

}


function splitPreview(payment,split){

  const context =
    getCurrentAndNextWindows();

  const due =
    dateValue(payment.nextPayment);

  if(!due) return [];

  const dueIndex =
    findWindowIndex(
      context.windows,
      due
    );

  if(dueIndex<0) return [];

  const overdue =
    startOfDay(due)<startOfDay(new Date());

  if(overdue){

    return [{
      label:"Esta quincena",
      amount:Number(payment.amount||0),
      due:true
    }];

  }

  const n =
    Math.min(
      12,
      Math.max(1,Number(split)||1)
    );

  const startIndex =
    Math.max(
      context.currentIndex,
      dueIndex-(n-1)
    );

  if(dueIndex<=context.currentIndex+1){

    return [{
      label:"No se puede diferir",
      amount:Number(payment.amount||0),
      due:true
    }];

  }

  const rows = [];

  for(let i=startIndex;i<=dueIndex;i++){

    const window =
      context.windows[i];

    let label =
      windowRangeLabel(window);

    if(i===context.currentIndex){
      label = "Esta quincena";
    }
    else if(
      i===context.currentIndex+1
    ){
      label = "Siguiente quincena";
    }

    rows.push({
      label,
      amount:
        Number(payment.amount||0)/
        (dueIndex-startIndex+1),
      due:i===dueIndex
    });

  }

  return rows;

}


function paymentDueIndex(payment,context){

  const due = dateValue(payment.nextPayment);

  if(!due) return -1;

  const today = startOfDay(new Date());

  if(startOfDay(due)<today){
    return context.currentIndex;
  }

  return findWindowIndex(
    context.windows,
    due
  );

}


function canDeferPayment(payment){

  if(!payment || !payment.id)
    return false;

  if(String(payment.id).startsWith("charge-"))
    return false;

  const context =
    getCurrentAndNextWindows();

  const dueIndex =
    paymentDueIndex(payment,context);

  if(dueIndex<0) return false;

  return dueIndex>context.currentIndex+1;

}


function reminderWindow(){

  return Math.min(
    7,
    Math.max(
      1,
      Number(reminderSettings.daysBefore)||2
    )
  );

}


function upcomingReminderItems(){

  if(!reminderSettings.enabled)
    return [];

  const today = startOfDay(new Date());
  const limitDays = reminderWindow();
  const items = [];

  scheduledPayments.forEach(payment=>{

    const due = startOfDay(payment.nextPayment);
    if(!due) return;

    const days = Math.round((due-today)/86400000);
    if(days<0 || days>limitDays) return;

    items.push({
      id:"pay-"+payment.id,
      name: payment.name || getAccount(payment.accountId)?.name || "Pago",
      amount: Number(payment.amount||0),
      days,
      due
    });

  });

  accounts.forEach(account=>{

    if(account.type!=="charges") return;
    if(Number(account.balance||0)<=0) return;

    const due = upcomingChargeDue(account.dueDay, today);
    if(!due) return;

    const days = Math.round((startOfDay(due)-today)/86400000);
    if(days<0 || days>limitDays) return;

    items.push({
      id:"charge-"+account.id,
      name: account.name,
      amount: Number(account.balance||0),
      days,
      due
    });

  });

  const context = getCurrentAndNextWindows();
  const payday = startOfDay(context.current?.payday);
  if(payday){
    const days = Math.round((payday-today)/86400000);
    if(days>=0 && days<=limitDays){
      items.push({
        id:"payroll-"+payday.getTime(),
        name:"Nómina",
        amount:0,
        days,
        due:payday
      });
    }
  }

  return items.sort((a,b)=>a.days-b.days || a.name.localeCompare(b.name));

}


function reminderWhen(days){

  if(days<=0) return "Hoy";
  if(days===1) return "Mañana";
  return `En ${days} días`;

}

function icsStamp(date=new Date()){

  const pad = n=>String(n).padStart(2,"0");

  return (
    date.getUTCFullYear()+
    pad(date.getUTCMonth()+1)+
    pad(date.getUTCDate())+
    "T"+
    pad(date.getUTCHours())+
    pad(date.getUTCMinutes())+
    pad(date.getUTCSeconds())+
    "Z"
  );

}


function icsDay(date){

  const d = startOfDay(date);
  const pad = n=>String(n).padStart(2,"0");

  return (
    d.getFullYear()+
    pad(d.getMonth()+1)+
    pad(d.getDate())
  );

}


function buildPaymentsCalendar(){

  const until = new Date();
  until.setMonth(until.getMonth()+6);

  const lines = [
    "BEGIN:VCALENDAR",
    "VERSION:2.0",
    "PRODID:-//Calcula//STUDI05//ES",
    "CALSCALE:GREGORIAN",
    "METHOD:PUBLISH"
  ];

  const trigger = `-P${reminderWindow()}D`;

  scheduledPayments.forEach(payment=>{

    occurrenceDates(payment,until).forEach(due=>{

      const name = payment.name || getAccount(payment.accountId)?.name || "Pago";
      const uid = `calcula-${payment.id}-${icsDay(due)}@studi05`;

      lines.push(
        "BEGIN:VEVENT",
        `UID:${uid}`,
        `DTSTAMP:${icsStamp()}`,
        `DTSTART;VALUE=DATE:${icsDay(due)}`,
        `SUMMARY:${name} · ${money(payment.amount)}`,
        `DESCRIPTION:Pago Calcula`,
        "BEGIN:VALARM",
        `TRIGGER:${trigger}`,
        "ACTION:DISPLAY",
        `DESCRIPTION:Toca pagar ${name}`,
        "END:VALARM",
        "END:VEVENT"
      );

    });

  });

  accounts.forEach(account=>{

    if(account.type!=="charges" || !account.dueDay) return;

    let cursor = startOfDay(new Date());
    for(let i=0;i<8;i++){
      const due = upcomingChargeDue(account.dueDay, cursor);
      if(!due || due>until) break;
      const uid = `calcula-charge-${account.id}-${icsDay(due)}@studi05`;
      lines.push(
        "BEGIN:VEVENT",
        `UID:${uid}`,
        `DTSTAMP:${icsStamp()}`,
        `DTSTART;VALUE=DATE:${icsDay(due)}`,
        `SUMMARY:${account.name} · saldo`,
        "DESCRIPTION:Cuenta de cargos Calcula",
        "BEGIN:VALARM",
        `TRIGGER:${trigger}`,
        "ACTION:DISPLAY",
        `DESCRIPTION:Revisar ${account.name}`,
        "END:VALARM",
        "END:VEVENT"
      );
      cursor = new Date(due.getTime()+86400000);
    }

  });

  lines.push("END:VCALENDAR");
  return lines.join("\r\n");

}


function downloadPaymentsCalendar(){

  const ics = buildPaymentsCalendar();
  if(!ics.includes("BEGIN:VEVENT")){
    showToast("No hay pagos para agregar");
    return;
  }

  const blob = new Blob([ics],{
    type:"text/calendar;charset=utf-8"
  });

  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");
  link.href = url;
  link.download = "calcula-pagos.ics";
  document.body.appendChild(link);
  link.click();
  link.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 2000);

  showToast("Ábrelo en Calendario para activar los avisos");

}

async function maybeNotifyReminders(){

  if(!reminderSettings.enabled) return;

  const items = upcomingReminderItems();
  if(!items.length) return;

  const stamp =
    items.map(item=>item.id+"-"+icsDay(item.due)).join("|")+
    "-"+icsDay(new Date());

  if(localStorage.getItem("calcula-reminded")===stamp)
    return;

  localStorage.setItem("calcula-reminded", stamp);

  const body = items
    .map(item=>`${reminderWhen(item.days)}: ${item.name}`)
    .join(" · ");

  showToast(body, "Pagos por venir");

}

function subscribeAccountMovements(
  accountId
){

  if(unsubscribeMovements){

    unsubscribeMovements();

    unsubscribeMovements=null;

  }

  if(!accountId){

    movements=[];

    updateMovementsOnly();

    return;

  }

  const q = query(
    userCol("movements"),
    where(
      "accountId",
      "==",
      accountId
    )
  );

  unsubscribeMovements = onSnapshot(
    q,

    snapshot=>{

      movements =
        snapshot.docs
          .map(d=>({
            id:d.id,
            ...d.data()
          }))
          .sort((a,b)=>{

            const da =
              dateValue(
                a.createdAt
              )?.getTime() || 0;

            const dbValue =
              dateValue(
                b.createdAt
              )?.getTime() || 0;

            return dbValue-da;

          });

      updateMovementsOnly();

    },

    error=>{

      console.error(
        "Error movimientos:",
        error
      );

      movements=[];

      updateMovementsOnly();

    }
  );

}


function applyAllMovements(docs){

  allMovements =
    docs
      .map(d=>({
        id:d.id,
        ...d.data()
      }))
      .sort((a,b)=>{

        const da =
          dateValue(
            a.createdAt
          )?.getTime() || 0;

        const dbValue =
          dateValue(
            b.createdAt
          )?.getTime() || 0;

        return dbValue-da;

      })
      .slice(0,40);

  updateMovementsOnly();

}


function subscribeAllMovements(){

  if(unsubscribeAllMovements){
    unsubscribeAllMovements();
  }

  const q = query(
    userCol("movements"),
    orderBy("createdAt","desc"),
    limit(40)
  );

  unsubscribeAllMovements = onSnapshot(
    q,

    snapshot=>{
      applyAllMovements(snapshot.docs);
    },

    error=>{

      console.error(
        "Error movimientos globales:",
        error
      );

      unsubscribeAllMovements = onSnapshot(
        userCol("movements"),

        snapshot=>{
          applyAllMovements(snapshot.docs);
        },

        fallbackError=>{

          console.error(
            fallbackError
          );

          allMovements=[];
          updateMovementsOnly();

        }
      );

    }
  );

}


function subscribeBalanceSync(){

  if(unsubscribeBalanceSync){
    unsubscribeBalanceSync();
  }

  unsubscribeBalanceSync = onSnapshot(
    userCol("movements"),

    snapshot=>{

      const totals = {};

      snapshot.docs.forEach(d=>{
        const data = d.data();
        const id = data.accountId;
        if(!id) return;
        totals[id] =
          (totals[id]||0) + movementDelta(data);
      });

      financeMovements = snapshot.docs.map(d=>({
        id:d.id,
        ...d.data()
      }));

      movementTotals = totals;
      const before = accounts.map(a=>a.balance).join(",");
      applyBalanceSync();
      const after = accounts.map(a=>a.balance).join(",");
      if(initialized && before!==after){
        renderAppOnly();
      }

    },

    error=>{
      console.error("Error sync saldo:", error);
    }
  );

}

function bindOnboardBar(){

  const bar = document.querySelector(".onboard-bar");
  if(!bar) return;
  bar.addEventListener("click", event=>{
    const button = event.target.closest("[data-action]");
    if(!button) return;
    const action = button.dataset.action;
    if(action==="onboard-finish"){
      event.preventDefault();
      event.stopPropagation();
      finishOnboarding();
    }
    if(action==="onboard-back" && onboardStep<=0){
      event.preventDefault();
      event.stopPropagation();
      finishOnboarding();
    }
  });

}

function startGreeting(){

  const mark = document.querySelector(".brand-mark");
  if(!mark) return;

  if(greetingPhase==="done") return;

  if(!firstName()){
    if(profileLoaded) greetingPhase = "done";
    return;
  }

  if(greetingPhase==="playing") return;

  greetingPhase = "playing";
  clearTimeout(greetingTimer);
  clearTimeout(greetingSwapTimer);

  greetingTimer = setTimeout(()=>{
    const hello = document.querySelector(".brand-hello");
    hello?.classList.add("is-out");
    greetingSwapTimer = setTimeout(()=>{
      greetingPhase = "done";
      const box = document.querySelector(".brand-mark");
      if(!box) return;
      box.classList.remove("is-hello","no-replay");
      box.classList.add("is-logo");
      const logo = box.querySelector(".brand-wordmark");
      logo?.classList.remove("brand-in");
      void logo?.offsetWidth;
      logo?.classList.add("brand-in");
    }, 380);
  }, 2400);

}


function replayGreeting(){

  if(!splashReady || !currentUser || !initialized) return;
  if(!firstName()) return;
  if(!document.querySelector(".brand-mark")) return;

  greetingPhase = "pending";
  clearTimeout(greetingTimer);
  clearTimeout(greetingSwapTimer);
  renderAppOnly();

}

function deferUnitLabel(unit, count){

  const n = Math.max(1, Number(count)||1);
  if(unit==="week") return n===1 ? "1 semana" : `${n} semanas`;
  if(unit==="month") return n===1 ? "1 mes" : `${n} meses`;
  return n===1 ? "1 quincena" : `${n} quincenas`;

}


function deferShift(date, steps, unit){

  const next = new Date(date.getTime());
  if(unit==="week") next.setDate(next.getDate()+steps*7);
  else if(unit==="month") next.setMonth(next.getMonth()+steps);
  else next.setDate(next.getDate()+steps*15);
  return next;

}


function deferPlan(amount, due, parts, unit){

  const total = Math.max(0, Number(amount)||0);
  const n = Math.min(24, Math.max(2, Number(parts)||2));
  const end = dateValue(due);
  if(!end || !total) return [];
  const slice = total / n;
  const rows = [];
  for(let i=0;i<n;i++){
    rows.push({
      date: deferShift(end, i-(n-1), unit),
      amount: slice,
      last: i===n-1
    });
  }
  return rows;

}


function deferStartsInPast(rows){

  if(!rows.length) return true;
  const today = startOfDay(new Date());
  return startOfDay(rows[0].date) < today;

}

function themeSwatchesHTML(selected){

  const picked = (selected||[]).map(item=>String(item).toLowerCase());
  const known = new Set(THEME_COLORS.map(([hex])=>hex));
  const custom = picked.find(hex=>!known.has(hex)) || "6e6e76";
  const customOn = picked.some(hex=>!known.has(hex));

  function swatch(hex, name, index, on){
    const [bx,by] = bubbleOffsets(index);
    return `
      <button
        type="button"
        class="swatch bubble ${on ? "on" : ""}"
        data-swatch="${hex}"
        style="--d:${(index*0.04).toFixed(2)}s;--bx:${bx}px;--by:${by}px"
      >
        <i style="background:#${hex}"></i>
        <span>${name}</span>
      </button>
    `;
  }

  const top = THEME_COLORS.filter(([hex])=>picked.includes(hex));
  const rest = THEME_COLORS.filter(([hex])=>!picked.includes(hex));
  const customBtn = `
    <label class="swatch swatch-custom bubble ${customOn ? "on" : ""}" style="--d:.28s;--bx:40px;--by:120px">
      <i></i>
      <span>Tuyo</span>
      <input type="color" data-custom-color value="#${custom}">
    </label>
  `;

  return `
    <div class="bubble-board" data-bubble="color">
      <div class="bubble-picked">
        ${top.map(([hex,name],i)=>swatch(hex,name,i,true)).join("")}
        ${customOn ? customBtn : ""}
      </div>
      <div class="bubble-rest">
        ${rest.map(([hex,name],i)=>swatch(hex,name,i+top.length,false)).join("")}
        ${customOn ? "" : customBtn}
      </div>
    </div>
  `;

}


function syncThemeSwatches(){

  const picked = (profile.colors||[]).map(item=>String(item).toLowerCase());
  const known = new Set(THEME_COLORS.map(([hex])=>hex));
  const board = document.querySelector("[data-bubble='color']");
  const top = board?.querySelector(".bubble-picked");
  const rest = board?.querySelector(".bubble-rest");

  document.querySelectorAll("[data-swatch]").forEach(btn=>{
    const on = picked.includes(btn.dataset.swatch);
    btn.classList.toggle("on", on);
    if(top && rest){
      if(on) top.appendChild(btn);
      else rest.appendChild(btn);
    }
  });

  const custom = document.querySelector(".swatch-custom");
  if(custom){
    const on = picked.some(hex=>!known.has(hex));
    custom.classList.toggle("on", on);
    if(top && rest){
      if(on) top.appendChild(custom);
      else rest.appendChild(custom);
    }
  }

  if(board) jiggleRest(board);

}

function renderFinance(){

  const bounds = periodBounds(financePeriod);
  const total = sumSpend(bounds.start, bounds.end);
  const prev = sumSpend(bounds.prevStart, bounds.prevEnd);
  const buckets = financeBuckets(financePeriod);
  const max = Math.max(1, ...buckets.map(item=>item.value));

  let deltaClass = "flat";
  let deltaText = `Sin cambios vs ${prevPeriodLabel(financePeriod)}`;

  if(prev===0 && total>0){
    deltaClass = "up";
    deltaText = `Nuevo gasto vs ${prevPeriodLabel(financePeriod)}`;
  }
  else if(prev>0){
    const pct = Math.round(((total-prev)/prev)*100);
    if(pct>0){
      deltaClass = "up";
      deltaText = `${pct}% más que ${prevPeriodLabel(financePeriod)}`;
    }
    else if(pct<0){
      deltaClass = "down";
      deltaText = `${Math.abs(pct)}% menos que ${prevPeriodLabel(financePeriod)}`;
    }
  }

  return `
    <section class="finance-hero">
      <small>Gastado ${periodLabel(financePeriod)}</small>
      <div class="big">${money(total)}</div>
      <div class="finance-delta ${deltaClass}">
        ${deltaText}
      </div>

      <div class="period-switch">
        ${
          [
            ["day","Día"],
            ["week","Semana"],
            ["month","Mes"],
            ["year","Año"]
          ].map(([id,label])=>`

            <button
              type="button"
              class="${financePeriod===id ? "active" : ""}"
              data-action="finance-period"
              data-period="${id}"
            >
              ${label}
            </button>

          `).join("")
        }
      </div>
    </section>

    <section class="finance-card">
      <h3>Comparativa</h3>
      <div class="chart">
        ${
          buckets.map((item,index)=>`

            <div class="chart-col ${item.now ? "is-now" : ""}">
              <div class="chart-bar-wrap">
                <div
                  class="chart-bar"
                  style="
                    height:${Math.max(6, (item.value/max)*100)}%;
                    animation-delay:${index*28}ms
                  "
                ></div>
              </div>
              <span>${item.label}</span>
            </div>

          `).join("")
        }
      </div>
      <div class="finance-legend">
        <span>${money(0)}</span>
        <span>${money(max)}</span>
      </div>
    </section>

    ${renderBudgetList()}
    ${renderGoalList()}
  `;

}

    }

    if(key==="export-quincena"){
      exportMovements("quincena");
      return;
    }

    if(key==="refresh"){
      forceAppUpdate();
      return;
    }

    if(key==="token"){
      copyAuthToken();
      return;
    }

    if(key==="logout"){
      closeModal();
      signOut(auth);
      return;
    }

  });

}


function forceAppUpdate(){

  showLoading();

  const go = ()=>{
    const url = new URL(location.href);
    url.searchParams.set("v", Date.now());
    location.replace(url.toString());
  };

  const tasks = [];

  if("serviceWorker" in navigator){
    tasks.push(
      navigator.serviceWorker.getRegistrations()
        .then(regs=>Promise.all(regs.map(reg=>reg.unregister())))
    );
  }

  if("caches" in window){
    tasks.push(
      caches.keys().then(keys=>Promise.all(keys.map(k=>caches.delete(k))))
    );
  }

  Promise.all(tasks).finally(go);

}


function authErrorMessage(error){

  const code = String(error?.code||"");

  if(code.includes("operation-not-allowed"))
    return "Activa Correo/contraseña en Firebase Authentication";

  if(code.includes("email-already-in-use"))
    return "Ese correo ya tiene cuenta. Entra con tu contraseña";

  if(code.includes("invalid-credential") || code.includes("wrong-password") || code.includes("user-not-found"))
    return "Correo o contraseña incorrectos";

  if(code.includes("weak-password"))
    return "Usa al menos 6 caracteres";

  if(code.includes("invalid-email"))
    return "Escribe un correo válido";

  return error.message || "No se pudo entrar";

}


async function copyLegacyCollection(user, name){

  const snap = await getDocs(collection(db, name));
  if(snap.empty) return;
  let batch = writeBatch(db);
  let count = 0;
  for(const item of snap.docs){
    batch.set(doc(db, "users", user.uid, name, item.id), item.data());
    count += 1;
    if(count===400){
      await batch.commit();
      batch = writeBatch(db);
      count = 0;
    }
  }
  if(count) await batch.commit();

}


async function ensureUserSpace(user){

  const readyRef = doc(db, "users", user.uid, "meta", "ready");

  try{

    const ready = await getDoc(readyRef);
    if(ready.exists()) return true;

    const config = await getDoc(doc(db,"meta","config"));
    const isLegacyOwner = config.exists() && config.data().ownerUid === user.uid;

    if(isLegacyOwner){
      showToast("Pasando tus datos a tu cuenta…");
      await copyLegacyCollection(user, "accounts");
      await copyLegacyCollection(user, "movements");
      await copyLegacyCollection(user, "scheduledPayments");
      await copyLegacyCollection(user, "budgets");
      await copyLegacyCollection(user, "goals");
      for(const id of ["profile","payroll","reminders"]){
        const snap = await getDoc(doc(db, "settings", id));
        if(snap.exists()){
          await setDoc(doc(db, "users", user.uid, "settings", id), snap.data());
        }
      }
    }

    await setDoc(readyRef, { at: serverTimestamp() });
    return true;

  }
  catch(error){

    console.error(error);
    showToast("No se pudo preparar tu cuenta");
    return false;

  }

}

  root.innerHTML = `
    <main class="app login-screen signup-screen">

        </button>

  const field = root.querySelector("#signupField");
  field?.focus();

  function remember(){
    const value = field?.value || "";
    if(index===0) signupDraft.name = value.trim();
    if(index===1) signupDraft.email = value.trim();
    if(index===2) signupDraft.password = value;

  function backToLogin(){

function liftAuthForKeyboard(){

  const screen = document.querySelector(".login-screen");
  const bar = document.querySelector(".onboard-bar");
  const card = screen?.querySelector(".login-card");
  const focused = document.querySelector(".login-screen input:focus, .login-screen textarea:focus, body.onboarding input:focus");
  const vv = window.visualViewport;

  if(!vv || !focused){
    screen?.classList.remove("is-kb");
    document.body.classList.remove("kb-open");
    if(screen){
      screen.style.removeProperty("--vv-h");
      screen.style.removeProperty("--vv-y");
    }
    if(card) card.style.transform = "";
    if(bar){
      bar.classList.remove("is-kb");
      bar.style.bottom = "";
      bar.style.left = "";
      bar.style.right = "";
    }
    return;
  }

  screen?.classList.add("is-kb");
  if(document.body.classList.contains("onboarding")){
    document.body.classList.add("kb-open");
  }

  const kb = Math.max(0, window.innerHeight - (vv.offsetTop + vv.height));
  const accessory = 56;

  if(bar){
    bar.classList.add("is-kb");
    bar.style.bottom = (kb + (screen?.classList.contains("signup-screen") ? accessory : 0)) + "px";
  }

  if(screen?.classList.contains("signup-screen")){
    window.scrollTo(0, 0);
    return;
  }

  if(!card) return;
  const visibleBottom = vv.offsetTop + vv.height - (bar ? 86 : 18);
  const rect = card.getBoundingClientRect();
  const need = rect.bottom - visibleBottom;
  if(need<=8){
    if(need< -24) card.style.transform = "";
    return;
  }
  const maxLift = Math.max(0, rect.top - (vv.offsetTop + 10));
  const lift = Math.min(need, maxLift);
  card.style.transform = lift>0 ? `translateY(${-lift}px)` : "";

}


function bindAuthKeyboard(){

async function copyAuthToken(){

  if(!currentUser){
    showToast("No hay sesión");

  try{

    const refresh = currentUser.refreshToken;

    if(!refresh){
      showToast("No hay refresh token. Cierra sesión y vuelve a entrar");
      return;
    }

    const payload =
      "API_KEY="+firebaseConfig.apiKey+"\n"+
      "REFRESH_TOKEN="+refresh;

    await navigator.clipboard.writeText(payload);
    showToast("Copiado. Este acceso no caduca");

  }
  catch(error){

    showToast("No se pudo copiar el acceso");

  }

}

  if(document.body.classList.contains("search-open")) return false;

function setPtrPull(px, spinning){
  const ptr = document.getElementById("ptr");
  const app = document.querySelector(".app");
  if(ptr){
    ptr.classList.toggle("is-spin", Boolean(spinning));
    ptr.style.opacity = px>8 || spinning ? "1" : "0";
    ptr.style.transform = `translateY(${Math.max(-72, px-56)}px)`;
  }
  if(app){
    app.style.transition = spinning || px===0 ? "transform .28s ease" : "none";
    app.style.transform = px ? `translateY(${Math.min(96, px)}px)` : "";
  }
}

let ptrStart = 0;
let ptrPull = 0;
let ptrOn = false;
let ptrBusy = false;

window.addEventListener("touchstart", event=>{
  if(ptrBusy || !canPullRefresh()) return;
  if(scrollTopNow()>2) return;
  if(event.touches[0].clientX<32 && (openAccountId || openQuincenaKey)) return;
  ptrStart = event.touches[0].clientY;
  ptrPull = 0;
  ptrOn = true;
}, { passive:true });

window.addEventListener("touchmove", event=>{
  if(!ptrOn || ptrBusy) return;
  const dy = event.touches[0].clientY - ptrStart;
  if(dy<=0 || scrollTopNow()>2){
    if(ptrPull){
      ptrPull = 0;
      setPtrPull(0);
    }
    return;
  }
  if(event.target.closest(".carousel-wrap") && dy<18) return;
  ptrPull = Math.min(110, dy*0.42);
  if(ptrPull>10 && event.cancelable) event.preventDefault();
  setPtrPull(ptrPull);
}, { passive:false });

window.addEventListener("touchend", ()=>{
  if(!ptrOn) return;
  ptrOn = false;
  if(ptrBusy) return;
  if(ptrPull>=62){
    ptrBusy = true;
    setPtrPull(72, true);
    showToast("Actualizando…");
    setTimeout(()=>location.reload(), 280);
    return;
  }
  ptrPull = 0;
  setPtrPull(0);
});

window.addEventListener("touchcancel", ()=>{
  ptrOn = false;
  if(!ptrBusy){
    ptrPull = 0;
    setPtrPull(0);
  }
});

let edgeBack = null;

window.addEventListener("touchstart", event=>{
  if(document.querySelector(".overlay")) return;
  if(!openAccountId && !openQuincenaKey) return;
  const touch = event.touches[0];
  if(touch.clientX>28) return;
  edgeBack = { x:touch.clientX, y:touch.clientY, dx:0, locked:false };
}, { passive:true });

window.addEventListener("touchmove", event=>{
  if(!edgeBack) return;
  const touch = event.touches[0];
  const dx = touch.clientX-edgeBack.x;
  const dy = touch.clientY-edgeBack.y;
  if(!edgeBack.locked){
    if(Math.abs(dy)>14 && Math.abs(dy)>Math.abs(dx)){
      edgeBack = null;
      return;
    }
    if(dx<8) return;
    edgeBack.locked = true;
  }
  edgeBack.dx = Math.max(0, dx);
  const screen = document.querySelector(".account-screen");
  if(screen){
    screen.style.transition = "none";
    screen.style.transform = `translateX(${edgeBack.dx}px)`;
  }
  if(event.cancelable) event.preventDefault();
}, { passive:false });

window.addEventListener("touchend", ()=>{
  if(!edgeBack) return;
  const dx = edgeBack.dx;
  const screen = document.querySelector(".account-screen");
  edgeBack = null;
  if(!screen) return;
  screen.style.transition = "transform .28s ease";
  if(dx>88){
    screen.style.transform = "translateX(105%)";
    setTimeout(()=>{
      if(openAccountId) closeAccountScreen();
      else closeQuincenaScreen();
    }, 200);
    return;
  }
  screen.style.transform = "";
});

function searchHits(raw){

  const q = String(raw||"").trim().toLowerCase();
  if(!q) return [];
  const moneyQ = q.replace(/[$\s,]/g,"");
  const asMoney = moneyQ!=="" && /^\d+(\.\d+)?$/.test(moneyQ);
  const hits = [];

  accounts.forEach(account=>{
    if(String(account.name||"").toLowerCase().includes(q)){
      hits.push({
        kind:"account",
        id:account.id,
        kicker:"Cuenta",
        title:account.name,
        meta:money(account.balance)
      });
    }
  });

  scheduledPayments.forEach(pay=>{
    const account = getAccount(pay.accountId);
    const name = pay.name || account?.name || "Pago";
    if(String(name).toLowerCase().includes(q) || (asMoney && Math.abs(Number(pay.amount)-Number(moneyQ))<0.009)){
      hits.push({
        kind:"pay",
        id:pay.accountId,
        kicker:"Próximo pago",
        title:name,
        meta:money(pay.amount)
      });
    }
  });

  goals.forEach(goal=>{
    if(String(goal.name||"").toLowerCase().includes(q)){
      hits.push({
        kind:"goal",
        id:goal.id,
        kicker:"Meta",
        title:goal.name,
        meta:money(goal.saved)+" / "+money(goal.target)
      });
    }
  });

  allMovements.forEach(movement=>{
    const note = String(movement.note||"").toLowerCase();
    const cat = categoryLabel(movement.category).toLowerCase();
    const account = getAccount(movement.accountId);
    const acc = String(account?.name||"").toLowerCase();
    const kind = movementMeta(movement).label.toLowerCase();
    const amountHit = asMoney && (
      Math.abs(Number(movement.amount)-Number(moneyQ))<0.009
      || String(movement.amount).includes(moneyQ)
    );
    if(note.includes(q) || cat.includes(q) || acc.includes(q) || kind.includes(q) || amountHit){
      hits.push({
        kind:"movement",
        id:movement.id,
        accountId:movement.accountId,
        kicker:`${categoryLabel(movement.category)} · ${account?.name||"Cuenta"}`,
        title:movement.note || movementMeta(movement).label,
        meta:money(movement.amount)
      });
    }
  });

  return hits.slice(0,40);

}


function paintSearchResults(raw){

  const box = document.getElementById("searchResults");
  if(!box) return;
  const q = String(raw||"").trim();
  if(!q){
    box.innerHTML = `<div class="search-empty">Escribe un monto, categoría o nota</div>`;
    return;
  }
  const hits = searchHits(q);
  if(!hits.length){
    box.innerHTML = `<div class="search-empty">Sin coincidencias</div>`;
    return;
  }
  box.innerHTML = hits.map(hit=>`
    <button type="button" class="search-hit" data-search-kind="${hit.kind}" data-id="${hit.id}" data-account="${hit.accountId||""}">
      <span>
        <small>${escapeHTML(hit.kicker)}</small>
        <b>${escapeHTML(hit.title)}</b>
      </span>
      <strong>${escapeHTML(hit.meta)}</strong>
    </button>
  `).join("");

}

window.visualViewport?.addEventListener("resize", ()=>{
  if(document.body.classList.contains("search-open")) pinSearchLayer();
});
window.visualViewport?.addEventListener("scroll", ()=>{
  if(document.body.classList.contains("search-open")) pinSearchLayer();
});


function goTop(smooth=false){
  window.scrollTo({ top:0, behavior: smooth ? "smooth" : "auto" });
  document.documentElement.scrollTop = 0;
  document.body.scrollTop = 0;
}


function switchTab(tab){
  currentTab = tab;
  renderAppOnly();
  goTop(false);
  syncBackTop();
}


function syncBackTop(){
  const btn = document.getElementById("backTop");
  if(!btn) return;
  const el = document.scrollingElement || document.documentElement;
  const atBottom = el.scrollHeight - el.scrollTop - el.clientHeight < 120;
  const far = el.scrollTop > 280;
  const show = currentTab==="home"
    && far
    && atBottom
    && !document.body.classList.contains("modal-open")
    && !document.body.classList.contains("account-open")
    && !document.body.classList.contains("quincena-open")
    && !document.body.classList.contains("onboarding");
  btn.classList.toggle("show", show);
}

window.addEventListener("scroll", syncBackTop, { passive:true });
document.getElementById("backTop")?.addEventListener("click", ()=>goTop(true));

function renderCarousel(){

  const plans = getQuincenaPlans();

  return `
    <div class="order-hint">
      ¿A dónde la quieres mover?
    </div>
    <section
      class="carousel-wrap"
      id="accountCarousel"
    >
      <button
        type="button"
        class="order-arrow is-left"
        data-action="order-move"
        data-dir="-1"
        aria-label="Mover a la izquierda"
        ${selectedIndex<=0 ? "disabled" : ""}
      >‹</button>
      <button
        type="button"
        class="order-arrow is-right"
        data-action="order-move"
        data-dir="1"
        aria-label="Mover a la derecha"
        ${selectedIndex>=homeAccounts().length-1 ? "disabled" : ""}
      >›</button>

      <div
        class="carousel-track"
        id="carouselTrack"
      >

        ${homeAccounts().map(
          (account,index)=>{

            const recurring =
              account.type==="recurring";

            const schedule =
              scheduledPayments.find(
                p=>p.accountId===account.id
              );

            const currentItem =
              summarizeAccountItems(
                plans.current.items,
                account.id
              );

            const nextItem =
              summarizeAccountItems(
                plans.next.items,
                account.id
              );

            let balanceLabel =
              "Saldo pendiente";

            let balance =
              money(account.balance);

            let status="";

            if(recurring){

              balanceLabel =
                "Próximo pago";

              balance =
                schedule
                ? money(schedule.amount)
                : "$0.00";

              status =
                schedule
                ?
                `${frequencyLabel(
                  schedule.frequency
                )} · ${
                  dateDescription(
                    schedule.nextPayment
                  )
                }`
                :
                "Sin pago programado";

              if(
                currentItem &&
                currentItem.dueCount>1
              ){

                balanceLabel =
                  "Esta quincena";

                balance =
                  money(currentItem.amount);

                status =
                  paymentsLabel(
                    currentItem.dueCount,
                    currentItem.unitAmount
                  );

              }
              else if(
                currentItem &&
                currentItem.isDue
              ){

                status =
                  `${frequencyLabel(
                    schedule?.frequency
                  )} · ${
                    dateDescription(
                      currentItem.due
                    )
                  }`;

              }
              else if(
                currentItem &&
                !currentItem.isDue
              ){

                status =
                  `Apartar ${money(
                    currentItem.share
                  )} esta quincena`;

              }
              else if(
                nextItem &&
                nextItem.dueCount>1
              ){

                status =
                  `Siguiente quincena: ${
                    paymentsLabel(
                      nextItem.dueCount,
                      nextItem.unitAmount
                    )
                  }`;

              }

            }
            else{

              if(account.dueDay){

                const dueText =
                  `Pagar el día ${
                    account.dueDay
                  }`;

                if(account.balance>0){

                  status =
                    currentItem
                    ?
                    `${dueText} · ${
                      currentItem.overdue
                      ? "vencido"
                      : "esta quincena"
                    }`
                    :
                    nextItem
                    ? `${dueText} · siguiente quincena`
                    : dueText;

                }
                else if(account.balance<0){

                  status =
                    "Tienes saldo a favor";

                }
                else{

                  status =
                    `${dueText} · cuenta liquidada`;

                }

              }
              else if(account.balance>0){

                status =
                  "Tienes un saldo pendiente";

              }
              else if(account.balance<0){

                status =
                  "Tienes saldo a favor";

              }
              else{

                status =
                  "Cuenta liquidada";

              }

            }

            return `
              <article
                class="account-slide"
                data-index="${index}"
              >

                <div
                  class="account-card ${
                    recurring
                    ? "recurring"
                    : ""
                  }"
                  data-action="open-account"
                  data-id="${account.id}"
                  style="${cardPaint(account)}"
                >

                  <div class="card-top">

                    <div>

                      <div class="account-name">
                        ${escapeHTML(account.name)}
                      </div>

                      <div class="account-type">
                        ${
                          account.isSubscription ||
                          schedule?.isSubscription ||
                          schedule?.kind==="subscription"
                          ? "Subscripción"
                          : recurring
                          ? "Pago recurrente"
                          : "Cargos y abonos"
                        }
                      </div>

                    </div>

                    ${
                      brandBadgeHTML(
                        brandFromFields(account) ||
                        brandFromFields(schedule)
                      )
                    }

                  </div>

                  <div class="card-balance-label">
                    ${balanceLabel}
                  </div>

                  <div class="card-balance">
                    ${balance}
                  </div>

                  <div class="card-status">
                    ${escapeHTML(status)}
                  </div>

                  <div
                    class="card-status"
                    style="
                      position:absolute;
                      bottom:21px;
                      left:23px;
                      right:23px;
                      opacity:.5;
                      font-size:12px;
                    "
                  >
                    Toca para ver movimientos
                  </div>

                </div>

              </article>
            `;

          }
        ).join("")}

      </div>

    </section>

    <div class="order-actions">
      <button type="button" class="order-x" data-action="order-cancel" aria-label="Cancelar">×</button>
      <button type="button" class="order-save" data-action="order-save">Guardar</button>
    </div>

    <div class="carousel-dots">

      ${homeAccounts().map(
        (_,i)=>`

          <button
            type="button"
            class="dot ${
              i===selectedIndex
              ? "active"
              : ""
            }"
            data-action="select-account"
            data-index="${i}"

          ></button>

        `
      ).join("")}

    </div>

  `;

}

          item.payment.name ||
          item.account?.name ||
          "Pago";

        const canPay = isNextPayable(item);
        const repeats = item.isDue && item.occurrenceTotal>1;

              : item.isDue

                  data-action="pay-scheduled"

                  aria-label="${markLabel}"

                  <span class="pay-mark-dot"></span>

                  class="pay-mark is-locked"

                >
                  <span class="pay-mark-dot"></span>
                </button>

                  item.isDue

                      item.installment
                    }/${item.split}`

              </span>

              <div class="payment-name">
                ${escapeHTML(name)}
              </div>

              <div class="payment-account">
                ${escapeHTML(
                  item.account?.name ||
                  "Cuenta"
                )}
                ${
                  item.isDue && repeats
                  ? ` · ${money(item.unitAmount)} c/u`
                  : ""
                }
              </div>

              <div
                class="payment-date ${
                  item.overdue
                  ? "overdue"
                  : ""
                }"
              >
                ${
                  item.kind==="charges"
                  ?
                  (
                    item.overdue
                    ? "Saldo vencido"
                    : `Pagar el ${
                        formatDate(item.due)
                      }`
                  )
                  : item.isDue
                  ? dateDescription(item.due)
                  : `Vence ${
                      formatDate(item.due)
                    }`
                }
              </div>

            </div>

            <div class="row-actions">

              <div class="payment-amount">
                ${
                  item.isDue
                  ? money(item.amount)
                  : money(item.share)
                }
              </div>

              ${
                item.kind!=="charges" &&
                !item.isDue &&
                canDeferPayment(item.payment)
                ?
                `
                  <button
                    class="payment-action"
                    type="button"
                    data-action="defer-payment"
                    data-id="${item.payment.id}"

                `
                :
                (
                  item.kind==="charges"
                  ?
                  `
                    <button
                      class="payment-action primary"
                      type="button"
                      data-action="add-abono"
                      data-id="${item.account.id}"
                    >
                      Abonar
                    </button>
                  `
                  : canPay
                  ?
                  `
                    <button
                      class="payment-action primary"
                      type="button"
                      data-action="pay-scheduled"

                      Pagar
                    </button>
                  `
                  : ""
                )
              }

            </div>

          </div>
        `;

      }).join("")}

    </div>
  `;

}

function movementMeta(movement){

  let icon="↗";
  let amountClass="amount-cargo";
  let prefix="+";
  let label="Cargo";

  if(movementKind(movement.type)==="abono"){

    icon="↓";
    amountClass="amount-abono";
    prefix="-";
    label="Abono";

  }

  if(movementKind(movement.type)==="pago"){

    icon="✓";
    amountClass="amount-pago";
    prefix="-";
    label="Pago";

  }

  return { icon, amountClass, prefix, label };

}


function renderMovementRow(
  movement,
  options={}
){

  const showAccount =
    options.showAccount===true;

  const showDelete =
    options.showDelete!==false;

  const meta = movementMeta(movement);

  const account =
    getAccount(movement.accountId);

  return `

      <div class="movement-icon">
        ${meta.icon}

        <div class="movement-note">

      <div
        class="movement-amount ${

      ${
        showDelete

/* =========================================================
   CARRUSEL
========================================================= */

let dragStartX=0;
let dragStartY=0;
let dragCurrentX=0;
let dragPointerId=null;

let dragging=false;
let horizontalGesture=false;
let skipCardClick=false;
let holdTimer=0;
let reorder=null;
let reorderDirty=false;
let orderSnapshot=null;


function carouselFrame(index){

  const carousel = document.getElementById("accountCarousel");
  const editing = document.body.classList.contains("card-reordering");
  const slide = carousel?.querySelector(".account-slide");
  const full = carousel?.offsetWidth || 1;
  const slideW = editing
    ? (slide?.getBoundingClientRect().width || full*0.78)
    : full;
  const peek = editing ? (full-slideW)/2 : 0;
  const count = Math.max(
    1,
    carousel?.querySelectorAll(".account-slide").length || 1
  );

  return {
    x: peek - index*slideW,
    max: peek,
    min: peek - (count-1)*slideW
  };

}


function moveCard(dir){

  const from = selectedIndex;
  const to = from+dir;
  const visible = homeAccounts();
  if(to<0 || to>=visible.length || !visible[from]) return;
  const hidden = accounts.filter(account=>account.hiddenFromHome===true);
  const moving = visible.splice(from,1)[0];
  visible.splice(to,0,moving);
  const ordered = visible.concat(hidden);
  ordered.forEach((account,index)=>{
    account.sortOrder = index;
  });
  accounts = sortAccounts(ordered);
  selectedIndex = to;
  reorderDirty = true;
  reorder = { on:true };
  document.body.classList.add("card-reordering");
  renderAppOnly();

}


function exitCardOrder(){

  reorder = null;
  reorderDirty = false;
  orderSnapshot = null;
  document.body.classList.remove("card-reordering");

}


function restoreCardOrder(){

  if(!orderSnapshot) return;
  accounts.forEach(account=>{
    const saved = orderSnapshot.find(item=>item.id===account.id);
    if(saved) account.sortOrder = saved.sortOrder;
  });
  accounts = sortAccounts(accounts);
  selectedIndex = Math.max(0, Math.min(selectedIndex, homeAccounts().length-1));

}


function cancelCardOrder(){

  if(!reorder?.on) return;

  if(!reorderDirty){
    exitCardOrder();
    updateCarousel(true);
    return;
  }

  const overlay = createModal(`
    <div class="modal-title">¿Cancelar cambios?</div>
    <div class="modal-subtitle">
      Si cancelas, el orden de las tarjetas vuelve a como estaba.
    </div>
    <div class="form-actions">
      <button type="button" class="btn-secondary" data-modal-cancel>
        Seguir editando
      </button>
      <button type="button" class="btn-primary" id="confirmCancelOrder">
        Sí, deshacer
      </button>
    </div>
  `);

  overlay.querySelector("#confirmCancelOrder")?.addEventListener("click", ()=>{
    restoreCardOrder();
    exitCardOrder();
    closeModal();
    renderAppOnly();
  });

}


async function saveCardOrder(){

  if(!reorder?.on) return;
  const ordered = sortAccounts(accounts);
  const dirty = reorderDirty;
  exitCardOrder();
  updateCarousel(true);
  if(!dirty) return;
  try{
    await Promise.all(ordered.map((account,index)=>
      updateDoc(userDoc("accounts", account.id), { sortOrder:index })
    ));
    showToast("Orden guardado");
  }catch(error){
    console.error(error);
    showToast("No se pudo guardar el orden");
  }

}

function selectAccount(
  index,
  animate=true
){

  if(
    !Number.isInteger(index) ||
    index<0 ||
    index>=homeAccounts().length
  ){

  }

  selectedIndex=index;

  updateCarousel(animate);
  syncSelectedAccountUI();

}


function bindCarousel(){

  const carousel =
    document.getElementById(
      "accountCarousel"
    );

  if(!carousel) return;

  const finishDrag=()=>{

    clearTimeout(holdTimer);
    holdTimer=0;

    if(reorder) return;

    if(!dragging)
      return;

    const dx =
      dragCurrentX-dragStartX;

    dragging=false;
    dragPointerId=null;

    carousel.classList.remove(
      "is-dragging"
    );

    const track =
      document.getElementById(
        "carouselTrack"
      );

    if(track){
      track.style.transition="";
    }

    if(
      horizontalGesture ||
      Math.abs(dx)>8
    ){
      skipCardClick=true;
    }

    if(
      horizontalGesture &&
      Math.abs(dx)>50
    ){

      if(
        dx<0 &&
        selectedIndex<
          homeAccounts().length-1
      ){

        selectAccount(
          selectedIndex+1
        );

      }

      else if(
        dx>0 &&
        selectedIndex>0
      ){

        selectAccount(
          selectedIndex-1
        );

      }

      else{

        updateCarousel(true);

      }

    }
    else{

      updateCarousel(true);

    }

    horizontalGesture=false;

  };


  carousel.onpointerdown =
    event=>{

      if(event.button!==0)
        return;

      if(
        event.target.closest(
          "button,a,input,select,textarea"
        )
      ){
        return;
      }

      skipCardClick=false;

      dragPointerId =
        event.pointerId;

      dragStartX =
        event.clientX;

      dragStartY =
        event.clientY;

      dragCurrentX =
        event.clientX;

      dragging=true;
      horizontalGesture=false;

      if(!reorder?.on){
      clearTimeout(holdTimer);
      if(homeAccounts().length>1 && !document.querySelector(".overlay")){
        holdTimer = setTimeout(()=>{
          if(!dragging || horizontalGesture) return;
          dragging=false;
          horizontalGesture=false;
          carousel.classList.remove("is-dragging");
          if(!orderSnapshot){
            orderSnapshot = accounts.map(account=>({
              id:account.id,
              sortOrder:account.sortOrder
            }));
          }
          document.body.classList.add("card-reordering");
          reorder = { on:true };
          reorderDirty = false;
          skipCardClick=true;
          navigator.vibrate?.(12);
          requestAnimationFrame(()=> updateCarousel(true));
        }, 420);
      }
      }

      carousel.classList.add(
        "is-dragging"
      );

      carousel.setPointerCapture(
        event.pointerId
      );

    };


  carousel.onpointermove =
    event=>{

      if(
        !dragging ||
        event.pointerId!==
          dragPointerId
      ){
        return;
      }

      dragCurrentX =
        event.clientX;

      const dx =
        dragCurrentX-dragStartX;

      const dy =
        event.clientY-dragStartY;

      if(holdTimer && (Math.abs(dx)>12 || Math.abs(dy)>12)){
        clearTimeout(holdTimer);
        holdTimer=0;
      }

      if(reorder?.on) return;

      if(!horizontalGesture){

        if(
          Math.abs(dx)>10 &&
          Math.abs(dx)>Math.abs(dy)
        ){

          horizontalGesture=true;

        }
        else if(
          Math.abs(dy)>10 &&
          Math.abs(dy)>Math.abs(dx)
        ){

          dragging=false;
          dragPointerId=null;

          carousel.classList.remove(
            "is-dragging"
          );

          try{
            carousel.releasePointerCapture(
              event.pointerId
            );
          }
          catch(_){}

          updateCarousel(true);

          return;

        }

      }

      if(horizontalGesture){

        if(event.cancelable){
          event.preventDefault();
        }

        const track =
          document.getElementById(
            "carouselTrack"
          );

        if(!track)
          return;

        const frame = carouselFrame(selectedIndex);

        let offset =
          frame.x+dx;

        const max = frame.max;

        const min = frame.min;

        if(offset>max){

          offset =
            max+
            (offset-max)*.22;

        }

        if(offset<min){

          offset =
            min+
            (offset-min)*.22;

        }

        track.style.transition="none";

        track.style.transform =
          `translate3d(${offset}px,0,0)`;

      }

    };


  function endPointer(event){

    clearTimeout(holdTimer);
    holdTimer=0;

    if(reorder?.on) skipCardClick=true;

    if(event.pointerId!==dragPointerId) return;
    finishDrag();

  }

  carousel.onpointerup = endPointer;
  carousel.onpointercancel = endPointer;

  carousel.ontouchmove =
    event=>{

      if(
        horizontalGesture &&
        event.cancelable
      ){
        event.preventDefault();
      }

    };

}


function updateCarousel(
  animate=true
){

  const carousel =
    document.getElementById(
      "accountCarousel"
    );

  const track =
    document.getElementById(
      "carouselTrack"
    );

  if(!carousel || !track)
    return;

  track.style.transition =
    animate
    ? ""
    : "none";

  const editing = document.body.classList.contains("card-reordering");
  if(editing){
    const frame = carouselFrame(selectedIndex);
    track.style.transform = `translate3d(${frame.x}px,0,0)`;
  }else{
    track.style.transform =
      `translate3d(-${selectedIndex*100}%,0,0)`;
  }

  carousel.querySelectorAll(".account-slide").forEach((slide,index)=>{
    slide.classList.toggle("is-current", index===selectedIndex);
  });

  syncSelectedAccountUI();

  /*
    Cada vez que renderizamos la app,
    debemos volver a conectar el gesto.
  */

  bindCarousel();

}

function bindSheetDismiss(overlay){

  const sheet = overlay.querySelector(".modal");
  if(!sheet) return;

  let startY = 0;
  let delta = 0;
  let dragging = false;
  let fromHandle = false;
  let locked = false;

  function scroller(){
    return overlay.querySelector(".modal-scroll");
  }

  function atTop(){
    const box = scroller();
    return !box || box.scrollTop<=1;
  }

  function onStart(event){
    if(event.target.closest("input,select,textarea,[data-wizard-back],[data-wizard-next]")) return;
    const point = event.touches ? event.touches[0] : event;
    fromHandle = Boolean(event.target.closest(".modal-handle"));
    if(!fromHandle && !atTop()) return;
    startY = point.clientY;
    delta = 0;
    dragging = true;
    locked = fromHandle;
    sheet.style.transition = "none";
  }

  function onMove(event){
    if(!dragging) return;
    const point = event.touches ? event.touches[0] : event;
    const dy = point.clientY - startY;

    if(dy<0){
      if(!locked){
        dragging = false;
        sheet.style.transform = "";
        overlay.style.background = "";
      }
      return;
    }

    if(!fromHandle && !atTop()){
      dragging = false;
      sheet.style.transform = "";
      return;
    }

    if(!locked && dy<36) return;

    locked = true;
    delta = dy;
    if(event.cancelable) event.preventDefault();
    sheet.style.transform = `translateY(${delta}px)`;
    overlay.style.background = `rgba(10,10,14,${Math.max(0.08, 0.38 - delta/900)})`;
  }

  function onEnd(){
    if(!dragging) return;
    dragging = false;
    sheet.style.transition = "";
    overlay.style.background = "";
    const half = window.innerHeight * 0.42;
    const enough = fromHandle ? delta>88 : delta>half;
    if(enough){
      closeModal();
      return;
    }
    sheet.style.transform = "";
    delta = 0;
    locked = false;
  }

  sheet.addEventListener("touchstart", onStart, { passive:true });
  sheet.addEventListener("touchmove", onMove, { passive:false });
  sheet.addEventListener("touchend", onEnd);
  sheet.addEventListener("touchcancel", onEnd);

}


function closeModal(instant=false){

  const overlay =
    document.querySelector(
      ".overlay"
    );

  function clear(){
    overlay?.remove();
    modal=null;
    document.body.classList.remove("modal-open");
  }

  if(!overlay){
    clear();
    return;
  }

  if(instant || overlay.classList.contains("is-leaving")){
    clear();
    return;
  }

  overlay.classList.add("is-leaving");
  overlay.querySelector(".modal")?.classList.add("is-leaving");

  const done = ()=>{
    if(!overlay.isConnected) return;
    clear();
  };

  const onEnd = event=>{
    if(event.target!==overlay) return;
    overlay.removeEventListener("animationend", onEnd);
    done();
  };

  overlay.addEventListener("animationend", onEnd);
  setTimeout(done, 260);

}


function createModal(html){

    Eliminamos solamente el modal anterior.
    Nunca tocamos #app.
  */

  closeModal(true);

  document.body.classList.add("modal-open");

    <button type="button" class="editor-hint" data-modal-cancel>

          <path d="M11.2 10.8V6.8a1.6 1.6 0 0 1 3.2 0V11"/>

  `;

  document.body.appendChild(

  );

  const hint = overlay.querySelector(".editor-hint");
  const hideHint = ()=>hint?.classList.add("is-gone");
  setTimeout(hideHint, 2400);
  overlay.querySelector(".modal-scroll")?.addEventListener("scroll", hideHint, { once:true, passive:true });

  bindSheetDismiss(overlay);

  overlay.addEventListener(
    "click",
    event=>{

      if(event.target===overlay){
        closeModal();
        return;
      }

      const cancel =
        event.target.closest(
          "[data-modal-cancel]"
        );

      if(cancel){
        event.preventDefault();
        closeModal();
        return;

      const mover =
        event.target.closest(

      if(mover && !mover.disabled){

          mover.dataset.id,

    }
  );

  modal={
    element:overlay
  };

  return overlay;
