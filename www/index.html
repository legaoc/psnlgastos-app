<title>Calcula</title>

<style>
:root{
  --accent:#111111;
  --accent-2:#3f3f46;
  --skeleton-color:#e6e6ea;
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  margin:0;
  padding:0;
  width:100%;
  max-width:100%;
  min-height:100%;
  overflow-x:hidden;
  overflow-y:auto;
  overscroll-behavior-x:none;
  overscroll-behavior-y:none;
  scrollbar-width:none;
  -ms-overflow-style:none;
  background:
    radial-gradient(1200px 640px at -8% -12%, color-mix(in srgb, var(--accent) 32%, transparent), transparent 54%),
    radial-gradient(900px 520px at 112% 0%, color-mix(in srgb, var(--accent-2) 24%, transparent), transparent 48%),
    radial-gradient(700px 480px at 50% 110%, rgba(210,230,255,.22), transparent 50%),
    #e7e7ee;
  color:#111;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",Inter,Arial,sans-serif;
  -webkit-text-size-adjust:100%;
}

body{
  min-height:100dvh;
  touch-action:pan-y;
}

button,
input,
select,
textarea{
  font:inherit;
}

button{
  border:0;
  cursor:pointer;
  touch-action:manipulation;
  color:inherit;
  background:transparent;
  -webkit-text-fill-color:currentColor;
}

input,
select,
textarea{
  -webkit-appearance:none;
  appearance:none;
}

input,
select{
  font-size:16px;
}

button:disabled{
  cursor:default;
}

::selection{
  background:#111;
  color:#fff;
}

html::-webkit-scrollbar,
body::-webkit-scrollbar,
.app::-webkit-scrollbar,
.account-screen::-webkit-scrollbar,
.modal-scroll::-webkit-scrollbar,
.carousel-wrap::-webkit-scrollbar{
  width:0;
  height:0;
  display:none;
}

/* =========================================================
   APP
========================================================= */

.app{
  width:100%;
  max-width:680px;
  margin:0 auto;
  min-height:100dvh;
  padding:
    max(18px,env(safe-area-inset-top))
    18px
    max(100px,calc(env(safe-area-inset-bottom) + 80px))
    18px;
}

body.onboarding .tabbar,
body.onboarding #backTop,
body.onboarding #ptr{
  display:none !important;
}

body.onboarding .app{
  min-height:100dvh;
  display:flex;
  flex-direction:column;
  padding-bottom:0;
}

.onboard-body{
  flex:1;
  min-height:0;
  display:flex;
  flex-direction:column;
  justify-content:center;
  padding:28px 0 22px;
  animation:softIn .28s ease;
}

body.onboarding .finance-hero{
  margin-top:6px;
}

body.onboarding .finance-hero .big{
  font-size:26px;
}

.bubble-board{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:22px;
  min-height:42vh;
}

.bubble-picked,
.bubble-rest{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  align-items:center;
  gap:10px;
  width:100%;
}

.bubble-picked{
  min-height:68px;
}

.bubble{
  animation:bubbleIn .58s cubic-bezier(.22,1.18,.36,1) both;
  animation-delay:var(--d,0s);
}

@keyframes bubbleIn{
  from{
    opacity:0;
    transform:translate(var(--bx,0px), var(--by,90px)) scale(.7);
  }
  to{
    opacity:1;
    transform:none;
  }
}

.bubble-picked .choice,
.bubble-picked .swatch{
  min-height:64px;
  padding:0 26px;
  font-size:17px;
}

.bubble-picked .swatch{
  padding:14px 16px 12px;
}

@keyframes bubblePop{
  0%{ transform:translateY(16px) scale(.94); }
  58%{ transform:translateY(-5px) scale(1.06); }
  100%{ transform:translateY(0) scale(1); }
}

.bubble-pop{
  animation:bubblePop .42s cubic-bezier(.22,1.28,.36,1);
}

@keyframes bubbleJiggle{
  0%{ transform:translateY(0); }
  40%{ transform:translateY(calc(var(--j,1) * 6px)); }
  100%{ transform:translateY(0); }
}

.bubble-jiggle{
  animation:bubbleJiggle .34s cubic-bezier(.22,.8,.36,1);
}

.onboard-bar{
  position:sticky;
  bottom:0;
  display:flex;
  gap:16px;
  margin:0 -18px;
  padding:18px 18px max(18px, env(safe-area-inset-bottom));
  z-index:60;
  pointer-events:auto;
  background:linear-gradient(
    to top,
    color-mix(in srgb, var(--accent) 8%, #e7e7ee) 62%,
    transparent
  );
}

body.dark .onboard-bar{
  background:linear-gradient(
    to top,
    #111114 62%,
    transparent
  );
}

.onboard-bar .btn-secondary,
.onboard-bar .btn-primary{
  flex:1;
}

.onboard-bar.is-kb{
  position:fixed;
  left:0;
  right:0;
  margin:0;
  z-index:40;
  display:flex;
  gap:16px;
  padding:16px 18px 14px;
}

.signup-screen.is-kb{
  justify-content:flex-start;
  overflow:hidden;
  padding:
    max(10px, env(safe-area-inset-top))
    18px
    96px;
}

.signup-screen.is-kb .onboard-exit,
.signup-screen.is-kb .onboard-dots,
.signup-screen.is-kb .modal-subtitle{
  display:none;
}

.signup-screen.is-kb .finance-hero{
  margin:0 0 8px;
  flex:0 0 auto;
}

.signup-screen.is-kb .finance-hero .big{
  font-size:20px;
}

.signup-screen.is-kb .onboard-body{
  flex:0 0 auto;
  justify-content:flex-start;
  padding:12px 0 28px;
  min-height:0;
}

body.onboarding.kb-open .onboard-exit,
body.onboarding.kb-open .onboard-dots{
  display:none;
}

body.onboarding.kb-open .finance-hero .big{
  font-size:20px;
}

body.onboarding.kb-open .onboard-body{
  justify-content:flex-start;
  padding:8px 0 12px;
}

/* =========================================================
   HEADER
========================================================= */

.topbar{
  height:54px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.brand{
  display:flex;
  flex-direction:column;
  gap:2px;
}

.brand small{
  color:#8b8b91;
  font-size:12px;
  font-weight:600;
}

.brand strong{
  font-size:21px;
  letter-spacing:-.7px;
}

.icon-btn{
  width:42px;
  height:42px;
  border-radius:50%;
  background:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:24px;
  box-shadow:0 2px 12px rgba(0,0,0,.06);
}

.icon-btn:active{
  transform:scale(.94);
}

.icon-btn svg{
  width:20px;
  height:20px;
  display:block;
}

.topbar-actions{
  display:flex;
  align-items:center;
  gap:8px;
  flex:0 0 auto;
}

.search-layer{
  position:fixed;
  inset:0;
  z-index:1600;
  display:none;
  flex-direction:column;
  padding:
    max(72px, calc(env(safe-area-inset-top) + 58px))
    14px
    12px;
  background:rgba(10,10,14,.52);
  backdrop-filter:blur(26px) saturate(170%);
  -webkit-backdrop-filter:blur(26px) saturate(170%);
}

.search-layer.show{
  display:flex;
}

.search-row{
  display:flex;
  align-items:center;
  gap:8px;
}

.search-capsule{
  flex:1;
  min-width:0;
  height:46px;
  border-radius:999px;
  background:rgba(255,255,255,.9);
  border:1px solid rgba(255,255,255,.6);
  display:flex;
  align-items:center;
  gap:8px;
  padding:0 16px;
  transform-origin:right center;
  animation:searchExpand .34s cubic-bezier(.22,.8,.2,1);
}

.search-capsule svg{
  width:18px;
  height:18px;
  flex:0 0 18px;
  color:#6b6b73;
}

.search-capsule input{
  flex:1;
  min-width:0;
  height:46px;
  border:0;
  background:transparent;
  outline:none;
  font-size:16px;
  font-weight:650;
  color:#111;
}

.search-close{
  width:42px;
  height:42px;
  border-radius:50%;
  background:rgba(255,255,255,.9);
  color:#111;
  -webkit-text-fill-color:#111;
  display:flex;
  align-items:center;
  justify-content:center;
  flex:0 0 42px;
  animation:searchPop .28s ease .06s both;
}

.search-close svg{
  width:16px;
  height:16px;
}

.search-results{
  margin-top:12px;
  min-height:0;
  flex:1;
  overflow:auto;
  -webkit-overflow-scrolling:touch;
  display:flex;
  flex-direction:column;
  gap:8px;
  padding-bottom:8px;
}

.search-hit{
  text-align:left;
  width:100%;
  border-radius:18px;
  padding:12px 14px;
  background:rgba(255,255,255,.72);
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

.search-hit small{
  display:block;
  color:#8b8b91;
  font-size:11px;
  font-weight:650;
}

.search-hit b{
  display:block;
  margin-top:2px;
  font-size:14px;
}

.search-empty{
  padding:18px 8px;
  text-align:center;
  color:#c9c9d1;
  font-size:13px;
  font-weight:650;
}

@keyframes searchExpand{
  from{
    width:42px;
    transform:scale(.72);
    opacity:.4;
  }
  to{
    transform:none;
    opacity:1;
  }
}

@keyframes searchPop{
  from{
    transform:scale(.6);
    opacity:0;
  }
  to{
    transform:none;
    opacity:1;
  }
}

body.search-open{
  overflow:hidden;
  position:fixed;
  width:100%;
  left:0;
  right:0;
}

body.search-open .app{
  pointer-events:none;
}

body.search-open .tabbar,
body.search-open #backTop,
body.search-open #ptr{
  display:none;
}

body.dark .search-capsule,
body.dark .search-close,
body.dark .search-hit{
  background:rgba(28,28,34,.9);
  border-color:rgba(255,255,255,.1);
  color:#f5f5f7;
}

body.dark .search-capsule input,
body.dark .search-close{
  color:#f5f5f7;
  -webkit-text-fill-color:#f5f5f7;
}

.brand-mark{
  display:flex;
  align-items:center;
  min-width:0;
  min-height:36px;
  position:relative;
}

.brand-wordmark{
  height:28px;
  width:auto;
  display:block;
}

.brand-mark.is-hello .brand-wordmark{
  position:absolute;
  opacity:0;
  pointer-events:none;
}

.brand-mark.is-logo .brand-hello{
  display:none;
}

.brand-hello{
  display:flex;
  flex-direction:column;
  justify-content:center;
  min-height:36px;
  line-height:1.1;
}

body.dark .hello-line{
  color:#c9c9d1;
}

.brand-hello strong{
  display:block;
  margin-top:2px;
  font-size:18px;
  font-weight:780;
  letter-spacing:-.5px;
  opacity:0;
  animation:helloIn .5s ease .12s forwards;
}

.brand-mark.no-replay .hello-line,
.brand-mark.no-replay .brand-hello strong{
  animation:none;
  opacity:1;
}

.brand-wordmark.brand-in{
  animation:helloIn .48s ease;
}

@keyframes helloIn{
  from{
    opacity:0;
    transform:translateY(8px);
  }
  to{
    opacity:1;
    transform:none;
  }
}

@keyframes helloOut{
  from{
    opacity:1;
    transform:none;
  }
  to{
    opacity:0;
    transform:translateY(-7px);
  }
}

.brand-hello.is-out{
  animation:helloOut .4s ease forwards;
}

body:not(.dark) .brand-wordmark{
  filter:invert(1);
}

/* =========================================================
   TOTAL
========================================================= */

.total{
  margin-top:17px;
  margin-bottom:20px;
}

.total-label{
  color:#8b8b91;
  font-size:13px;
  font-weight:600;
  margin-bottom:5px;
}

.total-value{
  font-size:38px;
  line-height:1;
  letter-spacing:-1.8px;
  font-weight:750;
}

.total-sub{
  margin-top:9px;
  color:#8b8b91;
  font-size:13px;
}

/* =========================================================
   CAROUSEL
========================================================= */

.carousel-wrap{
  position:relative;
  width:100%;
  overflow:hidden;
  border-radius:30px;
  touch-action:pan-y;
  user-select:none;
  -webkit-user-select:none;
  cursor:grab;
}

.carousel-wrap.is-dragging{
  cursor:grabbing;
  touch-action:none;
}

.order-hint{
  display:none;
  margin:0 0 10px;
  text-align:center;
  font-size:14px;
  font-weight:680;
  letter-spacing:-.2px;
}

.order-hint span{
  display:none;
}

.order-actions{
  display:none;
  flex-direction:column;
  align-items:center;
  gap:10px;
  margin:16px 0 6px;
}

body.card-reordering .order-actions{
  display:flex;
}

.order-x{
  width:34px;
  height:34px;
  border:0;
  border-radius:50%;
  background:rgba(255,255,255,.92);
  color:#111;
  -webkit-text-fill-color:#111;
  font-size:18px;
  line-height:1;
  box-shadow:0 8px 18px rgba(0,0,0,.12);
}

.order-save{
  border:0;
  border-radius:999px;
  padding:12px 26px;
  background:#111;
  color:#fff;
  -webkit-text-fill-color:#fff;
  font-size:15px;
  font-weight:720;
  letter-spacing:-.2px;
}

body.dark .order-x{
  background:rgba(38,38,42,.92);
  color:#f5f5f7;
  -webkit-text-fill-color:#f5f5f7;
}

body.dark .order-save{
  background:#2c2c31;
  color:#fff;
  -webkit-text-fill-color:#fff;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.16);
}

body.card-reordering .carousel-wrap{
  overflow:visible;
}

body.card-reordering .account-slide{
  flex-basis:78%;
  width:78%;
  min-width:78%;
}

body.card-reordering .account-card{
  transform:translateY(18px) scale(.94);
  opacity:.78;
  transition:transform .34s cubic-bezier(.22,.8,.2,1), box-shadow .34s ease, opacity .34s ease;
}

body.card-reordering .account-slide.is-current .account-card{
  transform:translateY(-12px) scale(1);
  opacity:1;
  box-shadow:0 24px 44px rgba(0,0,0,.28);
}

body.card-reordering .order-hint{
  display:block;
}

.order-arrow{
  display:none;
  position:absolute;
  top:50%;
  z-index:6;
  width:38px;
  height:38px;
  margin-top:-19px;
  border:0;
  border-radius:50%;
  background:rgba(255,255,255,.88);
  color:#111;
  font-size:26px;
  line-height:1;
  box-shadow:0 8px 20px rgba(0,0,0,.18);
}

.order-arrow.is-left{ left:10px; }
.order-arrow.is-right{ right:10px; }

.order-arrow:disabled{
  opacity:.28;
}

body.card-reordering .order-arrow{
  display:grid;
  place-items:center;
}

body.dark .order-arrow{
  background:rgba(28,28,32,.9);
  color:#f5f5f7;
}

body.dark .order-hint span{
  color:#b7b7c0;
}

.carousel-track{
  display:flex;
  width:100%;
  transform:translate3d(0,0,0);
  transition:transform .38s cubic-bezier(.22,.8,.2,1);
  will-change:transform;
}

.account-slide{
  flex:0 0 100%;
  width:100%;
  min-width:100%;
  padding:0 1px 4px;
}

.account-card{
  min-height:230px;
  border-radius:29px;
  padding:23px;
  color:#fff;
  position:relative;
  overflow:hidden;
  cursor:pointer;
  background:
    radial-gradient(circle at 100% 0%,rgba(255,255,255,.16),transparent 35%),
    linear-gradient(145deg,#242428,#080808);
  box-shadow:
    0 18px 40px rgba(0,0,0,.16),
    inset 0 1px rgba(255,255,255,.08);
}

.account-card.recurring{
  background:
    radial-gradient(circle at 90% 0%,rgba(255,255,255,.18),transparent 38%),
    linear-gradient(145deg,#38383d,#151517);
}

.card-top{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
}

.account-name{
  font-size:18px;
  font-weight:700;
  letter-spacing:-.3px;
}

.account-type{
  margin-top:5px;
  font-size:12px;
  opacity:.62;
}

.brand-badge{
  width:38px;
  height:38px;
  border-radius:12px;
  display:flex;
  align-items:center;
  justify-content:center;
  flex:0 0 38px;
  overflow:hidden;
  color:#fff;
  background:rgba(255,255,255,.12);
  border:1px solid rgba(255,255,255,.12);
}

.brand-badge svg,
.brand-mini svg{
  width:22px;
  height:22px;
  display:block;
  fill:none !important;
  stroke:currentColor;
  stroke-width:1.55;
  stroke-linejoin:round;
  stroke-linecap:round;
}

.brand-favicon{
  width:22px;
  height:22px;
  object-fit:contain;
  filter:grayscale(1) brightness(0) invert(1);
}

.brand-mini .brand-favicon,
.brand-hit .brand-favicon{
  filter:grayscale(1) brightness(0.25);
}

body.dark .brand-mini .brand-favicon,
body.dark .brand-hit .brand-favicon{
  filter:grayscale(1) brightness(0) invert(1);
}

.brand-mini{
  width:28px;
  height:28px;
  border-radius:8px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#555;
  background:transparent;
  flex:0 0 28px;
}

body.dark .brand-mini{
  color:#d8d8de;
}

.brand-suggest{
  display:flex;
  flex-direction:column;
  gap:6px;
  margin:-6px 0 12px;
}

.brand-hit{
  display:flex;
  align-items:center;
  gap:10px;
  width:100%;
  text-align:left;
  background:#f6f6f7;
  border-radius:14px;
  padding:8px 10px;
  border:0;
  font:inherit;
  color:inherit;
  cursor:pointer;
}

.brand-hit img,
.brand-hit .mini{
  width:28px;
  height:28px;
  border-radius:8px;
  object-fit:contain;
}

.brand-hit span{
  font-size:14px;
  font-weight:650;
}

.brand-add{
  width:100%;
  height:40px;
  border-radius:12px;
  background:transparent;
  color:#555;
  font-size:13px;
  font-weight:700;
}

.brand-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
  max-height:220px;
  overflow:auto;
  margin-top:8px;
}

.brand-grid button{
  height:64px;
  border-radius:14px;
  background:#f6f6f7;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:4px;
  font-size:10px;
  font-weight:700;
  color:#444;
}

.brand-grid img{
  width:22px;
  height:22px;
}

body.dark .brand-hit,
body.dark .brand-grid button{
  background:#222228;
  color:#f5f5f7;
}

.card-menu{
  width:35px;
  height:35px;
  border-radius:50%;
  background:rgba(255,255,255,.10);
  color:#fff;
  font-size:18px;
}

.card-menu:active{
  transform:scale(.9);
}

.card-balance-label{
  margin-top:38px;
  font-size:12px;
  opacity:.6;
}

.card-balance{
  margin-top:4px;
  font-size:37px;
  line-height:1;
  font-weight:750;
  letter-spacing:-1.6px;
}

.card-status{
  margin-top:8px;
  font-size:13px;
  opacity:.68;
}

.card-bottom{
  position:absolute;
  bottom:21px;
  left:23px;
  right:23px;
  display:flex;
  gap:9px;
}

.card-action{
  flex:1;
  height:44px;
  border-radius:14px;
  background:rgba(255,255,255,.11);
  color:#fff;
  -webkit-text-fill-color:#fff;
  font-size:13px;
  font-weight:650;
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
}

.card-action.primary{
  background:#fff;
  color:#111;
  -webkit-text-fill-color:#111;
}

.card-action:active{
  transform:scale(.97);
}

.card-action:disabled{
  opacity:.35;
}

/* =========================================================
   DOTS
========================================================= */

.carousel-dots{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:6px;
  min-height:27px;
}

.dot{
  width:6px;
  height:6px;
  border-radius:50%;
  background:#c9c9ce;
  transition:.25s;
  cursor:pointer;
  padding:0;
  border:0;
  display:block;
  flex:0 0 auto;
  -webkit-appearance:none;
  appearance:none;
}

.dot.active{
  width:18px;
  border-radius:8px;
  background:#111;
}

.organize-link{
  display:block;
  margin:2px auto 0;
  background:none;
  color:#777;
  font-size:13px;
  font-weight:650;
  padding:8px;
}

.organize-list{
  display:flex;
  flex-direction:column;
  gap:8px;
  margin-bottom:8px;
}

.organize-row{
  display:flex;
  align-items:center;
  gap:10px;
  background:#f6f6f7;
  border-radius:18px;
  padding:10px 10px 10px 14px;
}

.organize-row strong{
  display:block;
  font-size:15px;
  letter-spacing:-.2px;
}

.organize-row span{
  display:block;
  margin-top:2px;
  color:#888;
  font-size:12px;
}

.organize-row .info{
  flex:1;
  min-width:0;
}

.organize-move{
  width:40px;
  height:40px;
  border-radius:12px;
  background:#fff;
  color:#111;
  font-size:16px;
  box-shadow:0 1px 4px rgba(0,0,0,.06);
}

.organize-move:disabled{
  opacity:.28;
}

/* =========================================================
   EMPTY
========================================================= */

.empty{
  background:#fff;
  border-radius:28px;
  padding:38px 25px;
  text-align:center;
  box-shadow:0 4px 20px rgba(0,0,0,.05);
}

.empty-icon{
  font-size:38px;
  margin-bottom:12px;
}

.empty strong{
  display:block;
  font-size:19px;
  margin-bottom:7px;
}

.empty p{
  color:#888;
  font-size:14px;
  line-height:1.5;
  margin:0 0 22px;
}

.primary{
  background:#111;
  color:#fff;
  border-radius:15px;
  height:48px;
  padding:0 20px;
  font-weight:700;
}

.primary:active{
  transform:scale(.97);
}

/* =========================================================
   SECTIONS
========================================================= */

.section{
  margin-top:26px;
}

.section-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:12px;
}

.section-title{
  font-size:18px;
  font-weight:750;
  letter-spacing:-.4px;
}

.section-link{
  color:#777;
  font-size:13px;
  font-weight:650;
  background:none;
  padding:5px;
}

/* =========================================================
   UPCOMING
========================================================= */

.upcoming{
  display:flex;
  flex-direction:column;
  gap:9px;
}

.payment-row{
  background:#fff;
  border-radius:19px;
  padding:15px;
  display:flex;
  align-items:center;
  gap:13px;
  box-shadow:0 2px 12px rgba(0,0,0,.035);
}

.payment-icon{
  width:43px;
  height:43px;
  flex:0 0 43px;
  border-radius:14px;
  background:#f0f0f2;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:18px;
}

.payment-info{
  min-width:0;
  flex:1;
}

.payment-name{
  font-size:14px;
  font-weight:700;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.payment-account{
  margin-top:3px;
  color:#999;
  font-size:12px;
}

.payment-date{
  margin-top:3px;
  font-size:11px;
  color:#999;
}

.payment-date.overdue{
  color:#d22;
  font-weight:700;
}

.payment-amount{
  text-align:right;
  font-size:14px;
  font-weight:750;
  white-space:nowrap;
}

.payment-action{
  margin-top:6px;
  background:#111;
  color:#fff;
  -webkit-text-fill-color:#fff;
  border-radius:9px;
  height:29px;
  padding:0 9px;
  font-size:11px;
  font-weight:700;
}

.payment-action.primary{
  background:#111;
  color:#fff;
  -webkit-text-fill-color:#fff;
}

.payment-action:active{
  transform:scale(.95);
}

/* =========================================================
   QUINCENAS
========================================================= */

.quincena-stack{
  display:flex;
  flex-direction:column;
  gap:14px;
}

.quincena-card{
  position:relative;
  isolation:isolate;
  background:
    linear-gradient(
      180deg,
      rgba(255,255,255,.66) 0%,
      rgba(255,255,255,.42) 100%
    );
  backdrop-filter:blur(28px) saturate(190%);
  -webkit-backdrop-filter:blur(28px) saturate(190%);
  border:1px solid rgba(255,255,255,.58);
  border-radius:30px;
  padding:20px 16px 16px;
  box-shadow:
    0 12px 40px rgba(31,31,50,.10),
    inset 0 1px 0 rgba(255,255,255,.86),
    inset 0 -1px 0 rgba(255,255,255,.18);
  overflow:hidden;
}

.quincena-card::before{
  content:"";
  position:absolute;
  inset:0 0 auto 0;
  height:46%;
  background:linear-gradient(
    180deg,
    rgba(255,255,255,.38),
    transparent
  );
  pointer-events:none;
  z-index:0;
}

.quincena-card > *{
  position:relative;
  z-index:1;
}

.quincena-card.is-current{
  background:
    linear-gradient(
      165deg,
      rgba(58,58,66,.72) 0%,
      rgba(10,10,12,.78) 100%
    );
  color:#fff;
  border:1px solid rgba(255,255,255,.16);
  box-shadow:
    0 22px 56px rgba(0,0,0,.28),
    inset 0 1px 0 rgba(255,255,255,.24);
}

.quincena-card.is-current::before{
  background:linear-gradient(
    180deg,
    rgba(255,255,255,.16),
    transparent
  );
}

.quincena-head{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:12px;
}

.quincena-kicker{
  font-size:12px;
  font-weight:650;
  opacity:.55;
}

.quincena-cover{
  margin-top:3px;
  font-size:12px;
  opacity:.5;
  font-weight:600;
}

.quincena-card{
  cursor:pointer;
}

.quincena-hint{
  margin-top:12px;
  text-align:center;
  font-size:12px;
  font-weight:650;
  opacity:.48;
}

.quincena-needed{
  text-align:right;
}

.quincena-needed strong{
  display:block;
  font-size:32px;
  line-height:1;
  letter-spacing:-1.4px;
  font-weight:760;
}

.quincena-needed span{
  display:block;
  margin-top:6px;
  font-size:11px;
  opacity:.58;
}

.quincena-split{
  display:flex;
  gap:8px;
  margin-top:16px;
}

.quincena-split div{
  flex:1;
  background:rgba(255,255,255,.38);
  border:1px solid rgba(255,255,255,.46);
  border-radius:16px;
  padding:12px 13px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.5);
}

.quincena-card.is-current .quincena-split div{
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.10);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.12);
}

.quincena-split small{
  display:block;
  font-size:11px;
  font-weight:650;
  opacity:.58;
}

.quincena-split b{
  display:block;
  margin-top:5px;
  font-size:18px;
  font-weight:750;
  letter-spacing:-.5px;
}

.quincena-items{
  display:flex;
  flex-direction:column;
  gap:10px;
  margin-top:14px;
}

.quincena-row{
  display:grid;
  grid-template-columns:44px minmax(0,1fr) auto;
  align-items:center;
  gap:12px;
  background:rgba(255,255,255,.36);
  border:1px solid rgba(255,255,255,.5);
  border-radius:22px;
  padding:14px 12px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.55);
}

.quincena-row.is-due{
  padding:16px 12px;
}

.quincena-card.is-current .quincena-row{
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.10);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.12);
}

.quincena-card.is-current .payment-account,
.quincena-card.is-current .payment-date{
  color:rgba(255,255,255,.58);
}

.pay-mark{
  width:44px;
  height:44px;
  border-radius:50%;
  background:rgba(255,255,255,.35);
  border:1.5px solid rgba(0,0,0,.16);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:0;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.7);
  transition:transform .15s ease, background .15s ease, border-color .15s ease;
}

.pay-mark-dot{
  width:14px;
  height:14px;
  border-radius:50%;
  background:transparent;
  border:1.5px solid rgba(0,0,0,.28);
}

.pay-mark.primary{
  background:#111;
  border-color:#111;
  box-shadow:
    0 8px 18px rgba(0,0,0,.18),
    inset 0 1px 0 rgba(255,255,255,.2);
}

.pay-mark.primary .pay-mark-dot{
  background:#fff;
  border-color:#fff;
}

.pay-mark.is-locked{
  opacity:.38;
}

.pay-mark:active:not(:disabled){
  transform:scale(.96);
}

.quincena-card.is-current .pay-mark{
  background:rgba(255,255,255,.1);
  border-color:rgba(255,255,255,.28);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.16);
}

.quincena-card.is-current .pay-mark-dot{
  border-color:rgba(255,255,255,.55);
}

.quincena-card.is-current .pay-mark.primary{
  background:#fff;
  border-color:#fff;
}

.quincena-card.is-current .pay-mark.primary .pay-mark-dot{
  background:#111;
  border-color:#111;
}

.quincena-row .payment-info{
  min-width:0;
}

@media (prefers-reduced-motion:reduce){
  .pay-mark{
    transition:none;
  }
}

.quincena-row .payment-amount{
  font-size:26px;
  font-weight:760;
  letter-spacing:-1.2px;
  line-height:1;
}

.quincena-row .payment-account{
  margin-top:4px;
  font-size:12px;
}

.quincena-row .payment-date{
  margin-top:3px;
  font-size:12px;
}

.quincena-row .payment-name{
  font-size:16px;
  letter-spacing:-.3px;
}

.quincena-row.compact{
  display:flex;
  align-items:center;
  padding:12px;
}

.quincena-row.compact .payment-info{
  flex:1;
  min-width:0;
}

.quincena-row.compact .row-actions{
  margin:0;
  align-items:flex-end;
}

.quincena-row.compact .payment-amount{
  font-size:16px;
  letter-spacing:-.45px;
}

.quincena-row.compact .payment-name{
  font-size:14px;
}

.badge{
  display:inline-block;
  font-size:10px;
  font-weight:750;
  letter-spacing:.3px;
  text-transform:uppercase;
  padding:3px 7px;
  border-radius:7px;
  margin-bottom:5px;
}

.badge-pagar{
  background:#111;
  color:#fff;
}

.quincena-card.is-current .badge-pagar{
  background:#fff;
  color:#111;
}

.badge-apartar{
  background:rgba(255,255,255,.5);
  color:#111;
}

.quincena-card.is-current .badge-apartar{
  background:rgba(255,255,255,.16);
  color:#fff;
}

.quincena-card.is-current .payment-action{
  background:rgba(255,255,255,.16);
  color:#fff;
  -webkit-text-fill-color:#fff;
}

.quincena-card.is-current .payment-action.primary{
  background:#fff;
  color:#111;
  -webkit-text-fill-color:#111;
}

@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
  .quincena-card{
    background:#fff;
  }
  .quincena-card.is-current{
    background:#161618;
  }
}

.row-actions{
  display:flex;
  flex-direction:column;
  align-items:flex-end;
  gap:6px;
}

.split-options{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:7px;
  margin-bottom:8px;
}

.split-option{
  height:44px;
  border-radius:12px;
  background:#f1f1f3;
  font-weight:700;
  font-size:13px;
}

.split-option.active{
  background:#111;
  color:#fff;
}

.plan-preview{
  background:#f6f6f7;
  border-radius:18px;
  padding:14px 16px;
  margin:12px 0 6px;
}

.plan-preview div{
  display:flex;
  justify-content:space-between;
  gap:10px;
  font-size:13px;
  padding:6px 0;
}

.plan-preview div+div{
  border-top:1px solid #ececef;
}

/* =========================================================
   MOVEMENTS
========================================================= */

.movements{
  display:flex;
  flex-direction:column;
  gap:8px;
}

.movement{
  background:#fff;
  border-radius:18px;
  padding:14px 15px;
  display:flex;
  align-items:center;
  gap:12px;
}

.movement-icon{
  width:41px;
  height:41px;
  flex:0 0 41px;
  border-radius:13px;
  background:#f1f1f3;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:17px;
}

.movement-info{
  flex:1;
  min-width:0;
}

.movement-note{
  font-size:14px;
  font-weight:650;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.movement-date{
  color:#999;
  font-size:11px;
  margin-top:3px;
}

.movement-amount{
  font-size:14px;
  font-weight:750;
  white-space:nowrap;
}

.amount-cargo{
  color:#d63a3a;
}

.amount-abono{
  color:#159447;
}

.amount-pago{
  color:#111;
}

.delete-movement{
  width:28px;
  height:28px;
  flex:0 0 28px;
  border-radius:50%;
  background:#f3f3f4;
  color:#888;
  font-size:13px;
}

.delete-movement:active{
  transform:scale(.9);
}

.no-data{
  color:#999;
  background:#fff;
  border-radius:18px;
  padding:22px;
  text-align:center;
  font-size:13px;
}

/* =========================================================
   FAB
========================================================= */

.fab{
  display:none !important;
}

/* =========================================================
   TAB BAR
========================================================= */

.tabbar{
  position:fixed;
  left:0;
  right:0;
  bottom:max(10px, env(safe-area-inset-bottom));
  z-index:45;
  display:flex;
  justify-content:center;
  pointer-events:none;
}

.tabbar-pill{
  pointer-events:auto;
  display:flex;
  align-items:center;
  width:min(470px, calc(100% - 20px));
  padding:5px;
  border-radius:999px;
  background:rgba(255,255,255,.58);
  backdrop-filter:blur(28px) saturate(190%);
  -webkit-backdrop-filter:blur(28px) saturate(190%);
  border:1px solid rgba(255,255,255,.55);
  box-shadow:
    0 14px 40px rgba(0,0,0,.14),
    inset 0 1px 0 rgba(255,255,255,.75);
}

.tab-add{
  width:48px;
  height:48px;
  flex:0 0 48px;
  border-radius:50%;
  background:var(--accent);
  color:#fff;
  font-size:28px;
  line-height:1;
  margin:0 2px;
  box-shadow:0 10px 22px rgba(0,0,0,.28);
}

.tab-item{
  flex:1;
  height:50px;
  border-radius:999px;
  background:transparent;
  color:#6b6b73;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:2px;
  font-size:9px;
  font-weight:750;
  letter-spacing:.15px;
  min-width:0;
  padding:0 2px;
  transition:background .2s ease, color .2s ease, box-shadow .2s ease;
}

.tab-item svg{
  width:18px;
  height:18px;
}

.tab-item.active{
  background:rgba(255,255,255,.72);
  color:#111;
  box-shadow:0 4px 14px rgba(0,0,0,.06);
}

.tab-add:active{
  transform:scale(.96);
}

body.account-open .tabbar,
body.quincena-open .tabbar,
body.account-open #backTop,
body.quincena-open #backTop,
body.modal-open #backTop{
  display:none;
}

#backTop{
  position:fixed;
  left:50%;
  bottom:max(92px, calc(env(safe-area-inset-bottom) + 78px));
  z-index:46;
  display:flex;
  align-items:center;
  gap:8px;
  padding:10px 16px 10px 12px;
  border-radius:999px;
  background:rgba(17,17,17,.78);
  color:#fff;
  -webkit-text-fill-color:#fff;
  backdrop-filter:blur(18px) saturate(180%);
  -webkit-backdrop-filter:blur(18px) saturate(180%);
  font-size:13px;
  font-weight:750;
  letter-spacing:-.2px;
  box-shadow:0 10px 28px rgba(0,0,0,.22);
  opacity:0;
  pointer-events:none;
  transform:translateX(-50%) translateY(12px);
  transition:opacity .22s ease, transform .22s ease;
}

#backTop.show{
  opacity:1;
  pointer-events:auto;
  transform:translateX(-50%) translateY(0);
}

#backTop svg{
  width:16px;
  height:16px;
  display:block;
}

body.dark #backTop{
  background:rgba(245,245,247,.9);
  color:#111;
  -webkit-text-fill-color:#111;
}

/* =========================================================
   FINANZAS
========================================================= */

.finance-hero,
.finance-card,
.period-switch{
  background:rgba(255,255,255,.5);
  backdrop-filter:blur(24px) saturate(180%);
  -webkit-backdrop-filter:blur(24px) saturate(180%);
  border:1px solid rgba(255,255,255,.55);
  box-shadow:
    0 10px 30px rgba(0,0,0,.06),
    inset 0 1px 0 rgba(255,255,255,.8);
}

.finance-hero{
  border-radius:30px;
  padding:22px 20px 18px;
  margin-top:8px;
}

.finance-hero small{
  color:#8b8b91;
  font-size:12px;
  font-weight:650;
}

.finance-hero .big{
  margin-top:8px;
  font-size:38px;
  font-weight:760;
  letter-spacing:-1.6px;
  line-height:1;
}

.finance-delta{
  margin-top:10px;
  font-size:13px;
  font-weight:650;
}

.finance-delta.up{ color:#d63a3a; }
.finance-delta.down{ color:#159447; }
.finance-delta.flat{ color:#8b8b91; }

.period-switch{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:4px;
  padding:5px;
  border-radius:18px;
  margin-top:14px;
}

.period-switch button{
  height:38px;
  border-radius:14px;
  background:transparent;
  color:#777;
  font-size:12px;
  font-weight:750;
}

.period-switch button.active{
  background:#111;
  color:#fff;
}

.finance-card{
  border-radius:26px;
  padding:16px 14px 12px;
  margin-top:14px;
}

.finance-card h3{
  margin:0 0 14px;
  font-size:14px;
  font-weight:750;
}

.month-nav{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-top:4px;
}

.month-nav button{
  width:42px;
  height:42px;
  border-radius:14px;
  background:rgba(255,255,255,.55);
  color:#111;
  font-size:18px;
  font-weight:700;
}

.month-title{
  font-size:18px;
  font-weight:760;
  letter-spacing:-.4px;
  text-transform:capitalize;
}

.defer-lead{
  margin:8px 0 0;
  max-width:32ch;
  color:#6d6d76;
  font-size:14px;
  line-height:1.35;
}

.defer-custom,
.defer-card{
  width:100%;
  margin:0 0 10px;
  border:0;
  text-align:left;
  color:inherit;

/* =========================================================
   MODAL
========================================================= */

.overlay{
  position:fixed;
  inset:0;
  z-index:1000;
  background:rgba(10,10,14,.38);
  backdrop-filter:blur(22px) saturate(160%);
  -webkit-backdrop-filter:blur(22px) saturate(160%);
  display:flex;
  align-items:flex-end;
  justify-content:center;
  padding:0;
  animation:fadeIn .22s ease;
  overscroll-behavior:none;
  touch-action:none;
}

.overlay.is-leaving{
  animation:fadeOut .2s ease forwards;
  pointer-events:none;
}

.modal{
  width:100%;
  max-width:620px;
  max-height:100dvh;
  display:flex;
  flex-direction:column;
  overflow:hidden;
  overscroll-behavior:contain;
  background:rgba(255,255,255,.82);
  backdrop-filter:blur(32px) saturate(180%);
  -webkit-backdrop-filter:blur(32px) saturate(180%);
  border:1px solid rgba(255,255,255,.55);
  border-radius:28px 28px 0 0;
  padding:18px 20px 0;
  box-shadow:0 20px 70px rgba(0,0,0,.22);
  animation:sheetIn .28s cubic-bezier(.22,.8,.2,1);
  touch-action:pan-y;
}

.modal.is-leaving{
  animation:sheetOut .22s cubic-bezier(.4,0,1,1) forwards;
}

.editor-hint{
  position:absolute;
  top:max(56px, calc(env(safe-area-inset-top) + 44px));
  left:18px;
  right:18px;
  z-index:2;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:6px;
  background:transparent;
  color:rgba(255,255,255,.62);
  font-size:12px;
  font-weight:650;
  letter-spacing:.15px;
  text-align:center;
  line-height:1.35;
  transition:opacity .45s ease;
}

.editor-hint.is-gone{
  opacity:0;
  pointer-events:none;
}

.hint-finger{
  width:28px;
  height:40px;
  display:block;
  animation:hintSwipe 1.55s ease-in-out infinite;
}

.hint-finger svg{
  width:28px;
  height:28px;
  display:block;
  filter:drop-shadow(0 2px 6px rgba(0,0,0,.35));
}

@keyframes hintSwipe{
  0%{
    transform:translateY(0);
    opacity:.25;
  }
  28%{
    transform:translateY(0);
    opacity:1;
  }
  72%{
    transform:translateY(18px);
    opacity:.2;
  }
  100%{
    transform:translateY(22px);
    opacity:0;
  }
}

.onboard-exit{
  position:static;
  display:block;
  width:100%;
  margin:0 0 10px;
  color:rgba(17,17,17,.38);
}

.onboard-exit .hint-finger{
  display:none;
}

body.dark .onboard-exit{
  color:rgba(255,255,255,.4);
}

.modal-scroll{
  overflow-x:hidden;
  overflow-y:auto;
  -webkit-overflow-scrolling:touch;
  min-height:0;
  padding-bottom:8px;
  touch-action:pan-y;
}

body.modal-open{
  overflow:hidden;
}

body.modal-open .tabbar{
  display:none;
}

@keyframes fadeIn{
  from{opacity:0}
  to{opacity:1}
}

@keyframes fadeOut{
  from{opacity:1}
  to{opacity:0}
}

@keyframes sheetOut{
  from{
    transform:translateY(0);
    opacity:1;
  }
  to{
    transform:translateY(28px);
    opacity:0;
  }
}

@keyframes wizardIn{
  from{
    opacity:0;
    transform:translateX(calc(var(--wizard-dir, 1) * 14px));
  }
  to{
    opacity:1;
    transform:none;
  }
}

@keyframes softIn{
  from{
    opacity:0;
    transform:translateY(6px);
  }
  to{
    opacity:1;
    transform:none;
  }
}

.wizard-enter{

}

/* =========================================================
   LOADING
========================================================= */

.loading{
  position:fixed;
  inset:0;
  z-index:2000;
  background:rgba(255,255,255,.62);
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
  display:flex;
  align-items:center;
  justify-content:center;
}

.spinner{
  width:28px;
  height:28px;
  border:3px solid #ddd;
  border-top-color:#111;
  border-radius:50%;
  animation:spin .7s linear infinite;
}

@keyframes spin{
  to{transform:rotate(360deg)}
}

/* =========================================================
   SPLASH
========================================================= */

#splash{
  position:fixed;
  inset:0;
  z-index:5000;
  background:#050505;
  display:flex;
  align-items:center;
  justify-content:center;
  transition:opacity 1.05s cubic-bezier(.22,.8,.2,1), visibility 0s linear 1.05s;
}

#splash.is-out{
  opacity:0;
  visibility:hidden;
  pointer-events:none;
}

#splash .splash-stage{
  transition:transform 1.05s cubic-bezier(.22,.8,.2,1), filter .95s ease, opacity .9s ease;
}

#splash.is-out .splash-stage{
  transform:scale(1.06) translateY(-10px);
  filter:blur(12px);
  opacity:0;
}

body.is-revealing #app{
  animation:homeReveal 1.05s cubic-bezier(.22,.8,.2,1) both;
}

@keyframes homeReveal{
  0%{
    opacity:0;
    transform:translateY(22px);
    filter:blur(10px);
  }
  100%{

   Los datos ya se guardan en el caché local de Firestore

   la nube mediante onSnapshot. Esto solo hace visible el

const CLOUD_SYNC_KEY = "calcula-cloud-sync";

let syncListenerStarted = false;

function syncStatusLabel(){
  if(!cloudSyncEnabled || !navigator.onLine){
    return "Sin conexión: guardado en este dispositivo";
  }
  return syncInSync
    ? "Sincronizado con la nube"
    : "Sincronizando…";

function updateSyncStatusUI(){
  const text = document.getElementById("syncStatusText");
  if(text) text.textContent = syncStatusLabel();
  const head = document.getElementById("syncStatusHead");
  if(head) head.textContent = syncStatusLabel();
}

function startSyncStatusListener(){
  if(syncListenerStarted) return;
  syncListenerStarted = true;
  onSnapshotsInSync(db, ()=>{
    syncInSync = true;
    if(syncNowWaiting){
      syncNowWaiting = false;
      showToast("Sincronizado con la nube");
    }
    updateSyncStatusUI();
  });
  window.addEventListener("online", updateSyncStatusUI);
  window.addEventListener("offline", updateSyncStatusUI);
}

async function applyCloudSyncPreference(){
  startSyncStatusListener();
  try{
    if(cloudSyncEnabled) await enableNetwork(db);
    else await disableNetwork(db);
  }catch(error){
    console.error(error);
  }
  updateSyncStatusUI();
}

async function setCloudSyncEnabled(enabled){
  cloudSyncEnabled = enabled;
  localStorage.setItem(CLOUD_SYNC_KEY, enabled ? "1" : "0");

  try{
    if(enabled) await enableNetwork(db);
    else await disableNetwork(db);

}

    }
  ).format(Number(value || 0));

function isSpendMovement(movement){
  const kind = movementKind(movement.type);
  return kind==="cargo" || kind==="pago";
}


function spendAmount(movement){
  return isSpendMovement(movement)
    ? Number(movement.amount||0)
    : 0;
}


function periodBounds(period,now=new Date()){

  const today = new Date(
    now.getFullYear(),
    now.getMonth(),
    now.getDate()
  );

  if(period==="day"){
    const start = today;
    const end = new Date(today.getTime()+86400000);
    const prevStart = new Date(today.getTime()-86400000);
    return {start,end,prevStart,prevEnd:start};
  }

  if(period==="week"){
    const monday = (today.getDay()+6)%7;
    const start = new Date(today);
    start.setDate(today.getDate()-monday);
    const end = new Date(start);
    end.setDate(start.getDate()+7);
    const prevStart = new Date(start);
    prevStart.setDate(start.getDate()-7);
    return {start,end,prevStart,prevEnd:start};
  }

  if(period==="year"){
    const start = new Date(today.getFullYear(),0,1);
    const end = new Date(today.getFullYear()+1,0,1);
    const prevStart = new Date(today.getFullYear()-1,0,1);
    return {start,end,prevStart,prevEnd:start};
  }

  const start = new Date(today.getFullYear(), today.getMonth(), 1);
  const end = new Date(today.getFullYear(), today.getMonth()+1, 1);
  const prevStart = new Date(today.getFullYear(), today.getMonth()-1, 1);
  return {start,end,prevStart,prevEnd:start};

}


function sumSpend(start,end){

  return financeMovements.reduce((sum,movement)=>{
    const date = dateValue(movement.createdAt);
    if(!date || date<start || date>=end) return sum;
    return sum + spendAmount(movement);
  },0);

}

}


function incomeLabel(id){

function incomeUnit(count, cadence=profile.income){

  const map = {
    daily:["día","días"],
    weekly:["semana","semanas"],
    fortnightly:["quincena","quincenas"],
    monthly:["mes","meses"]
  };
  const pair = map[cadence] || map.fortnightly;
  return count===1 ? pair[0] : pair[1];

}


function parseMoneyInput(value){

  let cleaned = String(value||"")
    .replace(/[$\s]/g,"");

  if(cleaned.includes(".") && cleaned.includes(",")){
    cleaned = cleaned.replace(/,/g,"");
  }
  else if(cleaned.includes(",") && !cleaned.includes(".")){
    const bits = cleaned.split(",");
    if(bits.length===2 && bits[1].length>0 && bits[1].length<=2){
      cleaned = bits[0].replace(/,/g,"")+"."+bits[1];
    }
    else{
      cleaned = cleaned.replace(/,/g,"");
    }
  }
  else{
    cleaned = cleaned.replace(/,/g,"");
  }

  const n = Number(cleaned);
  if(!Number.isFinite(n)) return 0;
  return Math.round(n*100)/100;

}


function formatMoneyInput(value){

  const n = typeof value==="number" ? value : parseMoneyInput(value);
  if(!Number.isFinite(n) || n<0) return "";

  const parts = n.toFixed(2).split(".");
  parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g,",");
  return parts.join(".");

}


function bindMoneyInput(input){

  if(!input) return;

  input.setAttribute("inputmode","decimal");
  input.setAttribute("autocomplete","off");

  input.addEventListener("input", ()=>{
    const raw = input.value.replace(/[^\d.,]/g,"");
    if(!raw){
      input.value = "";
      return;
    }

    let intDigits = "";
    let cents = null;

    if(raw.includes(".")){
      const cut = raw.indexOf(".");
      intDigits = raw.slice(0, cut).replace(/\D/g,"");
      cents = raw.slice(cut+1).replace(/\D/g,"").slice(0,2);
    }
    else{
      const lastComma = raw.lastIndexOf(",");
      const after = lastComma>=0 ? raw.slice(lastComma+1).replace(/\D/g,"") : "";
      const before = lastComma>=0 ? raw.slice(0, lastComma).replace(/\D/g,"") : "";
      const commaIsDecimal =
        lastComma>=0 &&
        !raw.slice(0, lastComma).includes(",") &&
        (after.length===0 && raw.endsWith(",") || (after.length>0 && after.length<=2));
      if(commaIsDecimal){
        intDigits = before;
        cents = after;
      }
      else{
        intDigits = raw.replace(/\D/g,"");
      }
    }

    intDigits = intDigits.replace(/^0+(?=\d)/,"");
    const grouped = intDigits.replace(/\B(?=(\d{3})+(?!\d))/g,",");
    input.value = cents===null ? grouped : `${grouped || "0"}.${cents}`;
  });

  input.addEventListener("blur", ()=>{
    if(!String(input.value||"").trim()) return;
    input.value = formatMoneyInput(input.value);
  });

}


function customCats(){

function slugCat(name){

  const base = String(name||"")
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g,"")
    .replace(/[^a-z0-9]+/g,"-")
    .replace(/^-|-$/g,"");

  return base || "cat";

}


function allCats(includeAll=false){

  const base = includeAll
    ? BUDGET_CATS.slice()
    : BUDGET_CATS.filter(([id])=>id!=="all");
  const seen = new Set(base.map(([id])=>id));
  customCats().forEach(item=>{
    if(!item?.id || seen.has(item.id)) return;
    seen.add(item.id);
    base.push([item.id, item.label || item.id]);
  });
  return base;

}

async function addCustomCategory(label){

  const name = String(label||"").trim();
  if(!name) return null;
  if(allCats(true).some(([,title])=>title.toLowerCase()===name.toLowerCase())){
    const found = allCats(true).find(([,title])=>title.toLowerCase()===name.toLowerCase());
    return { id:found[0], label:found[1] };
  }

  let id = slugCat(name);
  if(allCats(true).some(([item])=>item===id)){
    id = id+"-"+Date.now().toString(36).slice(-3);
  }

  const cat = { id, label:name };
  profile.customCats = [...customCats(), cat];

  try{
    await setDoc(userDoc("settings","profile"),{
      customCats: profile.customCats
    }, { merge:true });
  }
  catch(error){
    console.error(error);
  }

  return cat;

}


function bindCatPicker(root, {attr, hidden, multi=false}){

  function selected(){
    return String(root.querySelector(hidden)?.value||"")
      .split(",")
      .map(item=>item.trim())
      .filter(Boolean);
  }

  function setSelected(ids){
    const field = root.querySelector(hidden);
    if(field) field.value = ids.join(",");
    root.querySelectorAll(`[data-choice="${attr}"]`).forEach(btn=>{
      btn.classList.toggle("on", ids.includes(btn.dataset.id));
    });
  }

  function chipButton(id, label, on){
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "choice"+(on?" on":"");
    btn.dataset.choice = attr;
    btn.dataset.id = id;
    btn.dataset.multi = multi ? "1" : "0";
    btn.textContent = label;
    return btn;
  }

  root.addEventListener("click", event=>{
    const add = event.target.closest(`[data-add-cat="${attr}"]`);
    if(add){
      event.preventDefault();
      const row = add.closest(".choice-row");
      if(!row) return;
      if(row.querySelector(".cat-new")){
        row.querySelector(".cat-new").focus();
        return;
      }
      const input = document.createElement("input");
      input.className = "cat-new";
      input.placeholder = "Nueva...";
      add.before(input);
      input.focus();
      let done = false;
      const commit = async()=>{
        if(done) return;
        done = true;
        const label = input.value.trim();
        input.remove();
        if(!label) return;
        const cat = await addCustomCategory(label);
        if(!cat) return;
        if(!root.querySelector(`[data-choice="${attr}"][data-id="${cat.id}"]`)){
          add.before(chipButton(cat.id, cat.label, true));
        }
        if(multi){
          const ids = selected();
          if(!ids.includes(cat.id)) ids.push(cat.id);
          setSelected(ids);
        }
        else setSelected([cat.id]);
      };
      input.addEventListener("keydown", ev=>{
        if(ev.key==="Enter"){
          ev.preventDefault();
          commit();
        }
        if(ev.key==="Escape"){
          done = true;
          input.remove();
        }
      });
      input.addEventListener("blur", ()=>setTimeout(commit, 80));
      return;
    }

    const choice = event.target.closest(`[data-choice="${attr}"]`);
    if(!choice) return;
    event.preventDefault();
    const id = choice.dataset.id;
    if(multi){
      const ids = selected();
      const index = ids.indexOf(id);
      if(index>=0) ids.splice(index,1);
      else ids.push(id);
      setSelected(ids);
    }
    else setSelected([id]);
  });

}


function bubbleOffsets(index){

  const dirs = [
    [-86,108],[78,124],[-42,146],[96,88],
    [-110,72],[58,152],[-24,118],[88,136]
  ];
  return dirs[index % dirs.length];

}


function bubbleButton([id,label], attr, multi, index, on){

  const [bx,by] = bubbleOffsets(index);
  return `
    <button
      type="button"
      class="choice bubble ${on ? "on" : ""}"
      data-choice="${attr}"
      data-id="${id}"
      data-multi="${multi ? "1" : "0"}"

    </button>
  `;

}


function bubbleBoardHTML(list, selected, attr, multi=false){

  return `
    <div class="bubble-board" data-bubble="${attr}">
      <div class="bubble-picked">
        ${top.map((item,i)=>bubbleButton(item, attr, multi, i, true)).join("")}
      </div>
      <div class="bubble-rest">
        ${rest.map((item,i)=>bubbleButton(item, attr, multi, i+top.length, false)).join("")}
      </div>
    </div>
  `;

}


function popBubble(el){

  if(!el) return;
  el.classList.remove("bubble-pop");
  void el.offsetWidth;
  el.classList.add("bubble-pop");

}


function jiggleRest(board){

  if(!board) return;
  board.querySelectorAll(".bubble-rest .bubble, .bubble-rest .swatch").forEach((el,i)=>{
    el.classList.remove("bubble-jiggle");
    el.style.setProperty("--j", i%2 ? "1" : "-1");
    void el.offsetWidth;
    el.classList.add("bubble-jiggle");
  });

}


function placeBubble(button){

  const board = button.closest(".bubble-board");
  if(!board) return;
  const picked = board.querySelector(".bubble-picked");
  const rest = board.querySelector(".bubble-rest");
  if(!picked || !rest) return;
  const multi = button.dataset.multi==="1";

  if(multi){
    if(button.classList.contains("on")) picked.appendChild(button);
    else rest.appendChild(button);
    popBubble(button);
    jiggleRest(board);
    return;
  }

  picked.querySelectorAll(".bubble").forEach(el=>{
    if(el!==button){
      el.classList.remove("on");
      rest.appendChild(el);
    }
  });
  picked.appendChild(button);
  popBubble(button);
  jiggleRest(board);

}

function monthSpendByCategory(category){

  const {start,end} = periodBounds("month");
  const source = allMovements.length ? allMovements : financeMovements;

  return source.reduce((sum,movement)=>{
    const date = dateValue(movement.createdAt);
    if(!date || date<start || date>=end) return sum;
    if(!isSpendMovement(movement)) return sum;
    const cat = String(movement.category||"otros");
    if(category==="all" || category===cat) return sum + spendAmount(movement);
    if(category==="subs"){
      const account = getAccount(movement.accountId);
      if(account?.isSubscription || account?.type==="recurring")
        return sum + spendAmount(movement);
    }
    return sum;
  },0);

}


function budgetStatus(budget){

  const spent = monthSpendByCategory(budget.category||"all");
  const cap = Number(budget.amount||0);
  const pct = cap>0 ? Math.min(100, Math.round((spent/cap)*100)) : 0;
  const level = pct>=100 ? "hot" : pct>=80 ? "warn" : "";
  return {spent, cap, pct, level};

}


function periodsUntil(deadline, cadence=profile.income){

  const end = dateValue(deadline);
  if(!end) return 1;
  const days = Math.max(1, Math.ceil((startOfDay(end)-startOfDay(new Date()))/86400000));
  if(cadence==="weekly") return Math.max(1, Math.ceil(days/7));
  if(cadence==="monthly") return Math.max(1, Math.ceil(days/30));
  if(cadence==="daily") return days;
  return Math.max(1, Math.ceil(days/15));

}


function goalStatus(goal){

  const saved = Number(goal.saved||0);
  const target = Number(goal.target||0);
  const cadence = goal.cadence || profile.income || "fortnightly";
  const left = Math.max(0, target-saved);
  const periods = periodsUntil(goal.deadline, cadence);
  const each = left/periods;
  const pct = target>0 ? Math.min(100, Math.round((saved/target)*100)) : 0;
  return {saved, target, left, periods, each, pct, cadence};

}


function goalDateLabel(value){

  const d = dateValue(value);
  if(!d) return "Sin fecha";
  return new Intl.DateTimeFormat("es-MX",{
    day:"numeric",
    month:"long",
    year:"numeric"
  }).format(d);

}


function goalTips(goal, status){

  const unit = incomeUnit(1, status.cadence);
  const units = incomeUnit(status.periods, status.cadence);
  const deadline = dateValue(goal.deadline);
  const days = deadline
    ? Math.max(0, Math.ceil((startOfDay(deadline)-startOfDay(new Date()))/86400000))
    : 0;
  const tips = [];

  if(status.left<=0){
    return ["Ya juntaste el monto. Puedes cerrar la meta o subir el objetivo."];
  }

  tips.push(`Llevas el ${status.pct}% · faltan ${money(status.left)}.`);
  tips.push(`Aparta ${money(status.each)} cada ${unit} y llegas en ${status.periods} ${units}.`);

  if(days){
    tips.push(`Fecha: ${goalDateLabel(goal.deadline)} · ${days} día${days===1?"":"s"}.`);
  }

  if(status.periods<=2){
    tips.push(`Queda poco. Conviene cubrir el resto esta ${unit}.`);
  }
  else if(status.pct<20){
    tips.push("Haz un apartado hoy para no dejar todo al final.");
  }
  else if(status.pct>=70){
    tips.push("Vas muy bien. No sueltes el ritmo.");
  }

  if(status.periods>3){
    const extra = status.periods+2;
    tips.push(`Si lo alargas a ${extra} ${incomeUnit(extra, status.cadence)}, bajaría a ${money(status.left/extra)} c/u.`);
  }

  return tips;

}


function csvEscape(value){
  return `"${String(value??"").replace(/"/g,'""')}"`;
}


function downloadCSV(filename, rows){

  const csv = "\uFEFF"+rows.map(row=>row.map(csvEscape).join(",")).join("\n");
  const blob = new Blob([csv],{type:"text/csv;charset=utf-8"});
  const link = document.createElement("a");
  link.href = URL.createObjectURL(blob);
  link.download = filename;
  link.click();
  setTimeout(()=>URL.revokeObjectURL(link.href), 1500);

}


function exportMovements(kind){

  let start;
  let end;
  let label;

  if(kind==="quincena"){
    const plans = getQuincenaPlans();
    start = plans.current.start;
    end = plans.current.end;
    label = "quincena";
  }
  else{
    const bounds = periodBounds("month");
    start = bounds.start;
    end = bounds.end;
    label = "mes";
  }

  const source = allMovements.length ? allMovements : financeMovements;
  const rows = [["Fecha","Cuenta","Tipo","Monto","Nota","Categoria"]];

  source.forEach(movement=>{
    const date = dateValue(movement.createdAt);
    if(!date || date<start || date>=end) return;
    const account = getAccount(movement.accountId);
    rows.push([
      date.toISOString().slice(0,10),
      account?.name || "",
      movementKind(movement.type),
      Number(movement.amount||0).toFixed(2),
      movement.note || "",
      categoryLabel(movement.category||"otros")
    ]);
  });

  if(rows.length===1){
    showToast("No hay movimientos en este periodo");
    return;
  }

  downloadCSV(`calcula-${label}.csv`, rows);
  showToast("Exportado");

}


function handleChoice(button){

  profile.name = document.getElementById("onboardName")?.value ?? profile.name;

  const kind = button.dataset.choice;
  const id = button.dataset.id;
  const multi = button.dataset.multi==="1";

  if(kind==="budget-cat" || kind==="quick-cat") return;

  if(kind==="income" || kind==="currency"){
    profile[kind] = id;
    document.querySelectorAll(`[data-choice="${kind}"]`).forEach(item=>
      item.classList.toggle("on", item.dataset.id===id)
    );
    placeBubble(button);
    return;
  }

  if(kind==="want"){
    const set = new Set(profile.wants||[]);
    if(set.has(id)) set.delete(id);
    else set.add(id);
    profile.wants = [...set];
    button.classList.toggle("on", profile.wants.includes(id));
    placeBubble(button);
    return;
  }

}

async function shareGoalCard(goalId){

  const goal = goals.find(item=>item.id===goalId);

    const text = `${goal.name}: ${status.pct}% · ${money(status.saved)} de ${money(status.target)}`;

async function drawGoalShareImage(goal, status, unit){

  const W = 1080;
  const H = 1350;
  const canvas = document.createElement("canvas");
  canvas.width = W;
  canvas.height = H;
  const ctx = canvas.getContext("2d");

  ctx.fillStyle = "#111114";
  ctx.fillRect(0,0,W,H);

  const glow = ctx.createRadialGradient(180, 120, 40, 180, 120, 520);
  glow.addColorStop(0, "rgba(90,110,170,.35)");
  glow.addColorStop(1, "rgba(17,17,20,0)");
  ctx.fillStyle = glow;
  ctx.fillRect(0,0,W,H);

  const glow2 = ctx.createRadialGradient(980, 220, 20, 980, 220, 480);
  glow2.addColorStop(0, "rgba(90,50,80,.28)");
  glow2.addColorStop(1, "rgba(17,17,20,0)");
  ctx.fillStyle = glow2;
  ctx.fillRect(0,0,W,H);

  ctx.fillStyle = "rgba(255,255,255,.58)";
  ctx.font = "600 28px -apple-system, BlinkMacSystemFont, sans-serif";
  ctx.fillText("META DE AHORRO", 90, 130);

  ctx.fillStyle = "#f5f5f7";
  ctx.font = "750 64px -apple-system, BlinkMacSystemFont, sans-serif";
  wrapShareText(ctx, goal.name||"Meta", 90, 210, W-180, 72);

  const cx = W/2;
  const cy = 560;
  const radius = 168;
  ctx.lineWidth = 22;
  ctx.strokeStyle = "rgba(255,255,255,.12)";
  ctx.beginPath();
  ctx.arc(cx, cy, radius, 0, Math.PI*2);
  ctx.stroke();
  ctx.strokeStyle = "#f5f5f7";
  ctx.lineCap = "round";
  ctx.beginPath();
  ctx.arc(cx, cy, radius, -Math.PI/2, -Math.PI/2 + Math.PI*2*(Math.max(0, Math.min(100, status.pct))/100));
  ctx.stroke();

  ctx.fillStyle = "#fff";
  ctx.font = "750 86px -apple-system, BlinkMacSystemFont, sans-serif";
  ctx.textAlign = "center";
  ctx.fillText(status.pct+"%", cx, cy+18);
  ctx.font = "600 26px -apple-system, BlinkMacSystemFont, sans-serif";
  ctx.fillStyle = "rgba(255,255,255,.55)";
  ctx.fillText("completado", cx, cy+56);
  ctx.textAlign = "left";

  const rows = [
    ["Juntado", money(status.saved)],
    ["Objetivo", money(status.target)],
    ["Resta", money(status.left)],
    ["Cada "+unit, money(status.each)]
  ];

  rows.forEach((row, index)=>{
    const col = index%2;
    const line = Math.floor(index/2);
    const x = 90 + col*480;
    const y = 820 + line*130;
    ctx.fillStyle = "rgba(255,255,255,.08)";
    roundRect(ctx, x, y, 440, 108, 28);
    ctx.fill();
    ctx.fillStyle = "rgba(255,255,255,.5)";
    ctx.font = "600 22px -apple-system, BlinkMacSystemFont, sans-serif";
    ctx.fillText(row[0], x+28, y+42);
    ctx.fillStyle = "#fff";
    ctx.font = "750 34px -apple-system, BlinkMacSystemFont, sans-serif";
    ctx.fillText(row[1], x+28, y+82);
  });

  try{
    const mark = await loadShareImage("calcula-wordmark.png");
    const mw = 280;
    const mh = mw * (mark.height/Math.max(1, mark.width));
    ctx.save();
    ctx.globalAlpha = 0.28;
    ctx.filter = "invert(1)";
    ctx.drawImage(mark, (W-mw)/2, H-mh-64, mw, mh);
    ctx.restore();
  }
  catch(error){
    ctx.fillStyle = "rgba(255,255,255,.28)";
    ctx.font = "600 28px -apple-system, BlinkMacSystemFont, sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("Calcula", W/2, H-70);
    ctx.textAlign = "left";
  }

  return new Promise((resolve, reject)=>{
    canvas.toBlob(blob=> blob ? resolve(blob) : reject(new Error("blob")), "image/png");
  });

}


function wrapShareText(ctx, text, x, y, maxWidth, lineHeight){

  const words = String(text).split(/\s+/);
  let line = "";
  let row = 0;
  words.forEach((word, i)=>{
    const test = line ? line+" "+word : word;
    if(ctx.measureText(test).width>maxWidth && line){
      ctx.fillText(line, x, y + row*lineHeight);
      line = word;
      row += 1;
    }
    else line = test;
    if(i===words.length-1) ctx.fillText(line, x, y + row*lineHeight);
  });

}


function roundRect(ctx, x, y, w, h, r){

  const radius = Math.min(r, w/2, h/2);
  ctx.beginPath();
  ctx.moveTo(x+radius, y);
  ctx.arcTo(x+w, y, x+w, y+h, radius);
  ctx.arcTo(x+w, y+h, x, y+h, radius);
  ctx.arcTo(x, y+h, x, y, radius);
  ctx.arcTo(x, y, x+w, y, radius);
  ctx.closePath();

}

function financeBuckets(period,now=new Date()){

  const {start,end} = periodBounds(period,now);
  const buckets = [];

  if(period==="day" || period==="week"){
    const days = period==="day" ? 7 : 7;
    const from = period==="day"
      ? new Date(start.getTime()-(6*86400000))
      : start;
    for(let i=0;i<days;i++){
      const a = new Date(from.getFullYear(), from.getMonth(), from.getDate()+i);
      const b = new Date(a.getTime()+86400000);
      const isNow = a.getTime()===new Date(now.getFullYear(),now.getMonth(),now.getDate()).getTime();
      buckets.push({
        label: new Intl.DateTimeFormat("es-MX",{weekday:"narrow"}).format(a),
        value: sumSpend(a,b),
        now: isNow
      });
    }
    return buckets;
  }

  if(period==="year"){
    for(let m=0;m<12;m++){
      const a = new Date(start.getFullYear(), m, 1);
      const b = new Date(start.getFullYear(), m+1, 1);
      buckets.push({
        label: new Intl.DateTimeFormat("es-MX",{month:"narrow"}).format(a),
        value: sumSpend(a,b),
        now: m===now.getMonth()
      });
    }
    return buckets;
  }

  const days = Math.round((end-start)/86400000);
  const step = days>16 ? 2 : 1;
  for(let i=0;i<days;i+=step){
    const a = new Date(start.getFullYear(), start.getMonth(), start.getDate()+i);
    const b = new Date(a.getTime()+86400000*step);
    buckets.push({
      label: String(a.getDate()),
      value: sumSpend(a,b),
      now: now>=a && now<b
    });
  }
  return buckets;

}

function escapeHTML(value){

  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


function dateValue(value){

  if(!value) return null;

  if(value instanceof Timestamp){
    return value.toDate();
  }

  if(value?.toDate){
    return value.toDate();
  }

  if(value instanceof Date){
    return value;
  }

  const date = new Date(value);

  return Number.isNaN(date.getTime())
    ? null
    : date;

}


function formatDate(value){

  const d = dateValue(value);

  if(!d) return "Sin fecha";

  return new Intl.DateTimeFormat("es-MX",{
    day:"numeric",
    month:"short",
    year:"numeric"
  }).format(d);

}


function formatShortDate(value){

  const d = dateValue(value);

  if(!d) return "";

  return new Intl.DateTimeFormat("es-MX",{
    day:"numeric",
    month:"short"
  }).format(d);

}

const splashStarted = Date.now();
let splashClosed = false;
let splashReady = false;

function dismissSplash(){

  if(splashClosed) return;
  splashClosed = true;

  const splash =
    document.getElementById("splash");

  if(!splash){
    finishSplash();
    return;
  }

  const reduced =
    window.matchMedia(
      "(prefers-reduced-motion: reduce)"
    ).matches;

  const minMs = reduced ? 900 : 3400;
  const wait = Math.max(
    0,
    minMs - (Date.now() - splashStarted)
  );

  setTimeout(()=>{
    finishSplash();
    document.body.classList.add("is-revealing");
    requestAnimationFrame(()=>{
      splash.classList.add("is-out");
    });
    setTimeout(()=>{
      splash.remove();
      document.body.classList.remove("is-revealing");
    }, 1100);
  }, wait);

}

setTimeout(dismissSplash, 7000);


function finishSplash(){

  if(splashReady) return;
  splashReady = true;
  if(!maybeShowInstallCoach()){
    paintAfterSplash();
  }

}


function paintAfterSplash(){

  if(!splashReady) return;
  if(!currentUser){
    renderLogin();
    return;
  }
  if(!initialized){
    renderSkeleton();
    return;
  }
  renderAppOnly();

}


function isStandaloneApp(){
  return window.matchMedia("(display-mode: standalone)").matches
    || window.navigator.standalone===true
    || (window.Capacitor
      && typeof window.Capacitor.isNativePlatform === "function"
      && window.Capacitor.isNativePlatform());
}


function maybeShowInstallCoach(){

  if(isStandaloneApp()) return false;
  if(localStorage.getItem("calcula-install-skip")==="1") return false;

  const ua = navigator.userAgent || "";
  const ios = /iPhone|iPad|iPod/.test(ua)
    || (navigator.platform==="MacIntel" && navigator.maxTouchPoints>1);
  if(!ios) return false;

  const coach = document.getElementById("installCoach");
  const skip = document.getElementById("installSkip");
  if(!coach || !skip) return false;

  coach.classList.add("show");

  setTimeout(()=>{
    skip.classList.add("show");
  }, 5000);

  skip.addEventListener("click", ()=>{
    localStorage.setItem("calcula-install-skip","1");
    coach.classList.remove("show");
    paintAfterSplash();
  }, { once:true });

  return true;

}


function sortAccounts(list){

  return (list||[]).slice().sort((a,b)=>{

    const as = Number.isFinite(Number(a.sortOrder))
      ? Number(a.sortOrder)
      : Number.MAX_SAFE_INTEGER;

    const bs = Number.isFinite(Number(b.sortOrder))
      ? Number(b.sortOrder)
      : Number.MAX_SAFE_INTEGER;

    if(as!==bs) return as-bs;

    const ta = dateValue(a.createdAt)?.getTime()||0;
    const tb = dateValue(b.createdAt)?.getTime()||0;

    return ta-tb;

  });

}


function nextAccountSortOrder(){

  if(!accounts.length) return 0;

  const max = accounts.reduce((n,account)=>{
    const value = Number(account.sortOrder);
    if(!Number.isFinite(value) || value>=Number.MAX_SAFE_INTEGER)
      return n;
    return Math.max(n,value);
  }, -1);

  return max+1;

}

function shadeHex(hex, factor){

  const clean = String(hex||"").replace("#","");
  if(!/^[0-9a-fA-F]{6}$/.test(clean)) return "080808";

  const n = parseInt(clean,16);
  const ch = shift=>Math.max(0, Math.min(255, Math.round(((n>>shift)&255)*factor)));

  return [ch(16), ch(8), ch(0)]
    .map(v=>v.toString(16).padStart(2,"0"))
    .join("");

}

  amount,
  note="",
  extra={}
}){

  await addDoc(
    userCol("movements"),
    {
      accountId,
      type,
      amount,
      note,
      createdAt: serverTimestamp(),
      ...extra
    }
  );

  const kind = movementKind(type);

  if(kind!=="cargo" && kind!=="abono")
    return;

  const account = getAccount(accountId);
  const current = Number(account?.balance||0);
  const next =
    kind==="cargo"
    ? current+amount
    : current-amount;

  await updateDoc(
    userDoc("accounts",accountId),
    { balance: next }
  );

}


function normalizeAccount(account){

  return {
    ...account,
    type:account.type || "charges",
    balance:Number(account.balance || 0),
    dueDay:Number(account.dueDay || 0),
    sortOrder:Number.isFinite(Number(account.sortOrder))
      ? Number(account.sortOrder)
      : Number.MAX_SAFE_INTEGER,
    categories: Array.isArray(account.categories) ? account.categories : []
  };

}


function movementKind(type){
  return String(type||"").trim().toLowerCase();
}


function movementDelta(movement){
  const kind = movementKind(movement.type);
  const amount = Number(movement.amount||0);
  if(kind==="cargo") return amount;
  if(kind==="abono") return -amount;
  return 0;
}


function applyBalanceSync(){

  if(!accounts.length) return;

  accounts.forEach(account=>{

    if((account.type||"charges")==="recurring")
      return;

    const computed = Number(
      (movementTotals[account.id]||0).toFixed(2)
    );

    const current = Number(account.balance||0);

    if(Math.abs(current-computed)<0.009)
      return;

    if(lastSyncedBalance[account.id]===computed)
      return;

    lastSyncedBalance[account.id]=computed;
    account.balance=computed;

    updateDoc(
      userDoc("accounts",account.id),
      {balance:computed}
    ).catch(error=>{
      console.error("sync balance", error);
      delete lastSyncedBalance[account.id];
    });

  });

}

function titleToSlug(title){

  return String(title||"")
    .toLowerCase()
    .replaceAll("+","plus")
    .replaceAll(".","dot")
    .replaceAll("&","and")
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g,"")
    .replace(/[^a-z0-9]/g,"");

}


function brandSearchText(brand){

  return [brand.title, ...(brand.aliases||[])]
    .join(" ")
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g,"");

}


let brandCatalog = null;
let brandCatalogLoading = null;


async function loadBrandCatalog(){

  if(brandCatalog) return brandCatalog;
  if(brandCatalogLoading) return brandCatalogLoading;

  brandCatalogLoading = (async()=>{

    const extras = EXTRA_BRANDS.map(item=>({
      title:item.title,
      slug:item.slug || titleToSlug(item.title),
      hex:item.hex || "111111",
      domain:item.domain || "",
      aliases:[item.title]
    }));

    try{

      const res = await fetch(
        "https://cdn.jsdelivr.net/npm/simple-icons@14/_data/simple-icons.json"
      );
      const data = await res.json();

      const fromLib = data.map(item=>{
        const aliases = [
          item.title,
          ...((item.aliases&&item.aliases.aka)||[])
        ];
        return {
          title:item.title,
          slug:titleToSlug(item.title),
          hex:item.hex,
          domain:"",
          aliases
        };
      });

      brandCatalog = extras.concat(fromLib);

    }
    catch(error){

      console.error(error);
      brandCatalog = extras;

    }

    return brandCatalog;

  })();

  return brandCatalogLoading;

}


function searchBrands(query,limit=8){

  const q = String(query||"")
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g,"")
    .trim();

  if(q.length<2 || !brandCatalog) return [];

  const scored = [];

  brandCatalog.forEach(brand=>{
    const hay = brandSearchText(brand);
    if(hay.startsWith(q) || brand.title.toLowerCase().startsWith(query.toLowerCase())){
      scored.push({ brand, score:0 });
    }
    else if(hay.includes(" "+q) || hay.includes(q)){
      scored.push({ brand, score:1 });
    }
  });

  scored.sort((a,b)=>a.score-b.score || a.brand.title.localeCompare(b.brand.title));

  const seen = new Set();
  const out = [];

  scored.forEach(row=>{
    if(seen.has(row.brand.slug+row.brand.domain)) return;
    seen.add(row.brand.slug+row.brand.domain);
    out.push(row.brand);
  });

  return out.slice(0,limit);

}

const GENERIC_OUTLINE =
  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round"><rect x="6" y="6" width="12" height="12" rx="3"/><path d="M9.5 12h5M12 9.5v5"/></svg>';

const outlineSvgCache = new Map();


function toOutlineSvg(raw){

  const paths = [...String(raw).matchAll(/<path[^>]*\sd="([^"]+)"[^>]*>/g)]
    .map(match=>match[1]);

  if(!paths.length) return GENERIC_OUTLINE;

  return (
    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.55" stroke-linejoin="round" stroke-linecap="round">' +
    paths.map(d=>'<path d="'+d+'"/>').join("") +
    "</svg>"
  );

}


async function getOutlineSvg(slug){

  if(!slug) return GENERIC_OUTLINE;
  if(outlineSvgCache.has(slug)) return outlineSvgCache.get(slug);

  try{
    const res = await fetch(
      "https://cdn.jsdelivr.net/npm/simple-icons@14/icons/"+
      encodeURIComponent(slug)+".svg"
    );
    if(!res.ok) throw new Error("icon");
    const svg = toOutlineSvg(await res.text());
    outlineSvgCache.set(slug, svg);
    return svg;
  }
  catch(error){
    outlineSvgCache.set(slug, GENERIC_OUTLINE);
    return GENERIC_OUTLINE;
  }

}

  if(source==="ddg"){

      encodeURIComponent(host)+".ico";

  return "https://www.google.com/s2/favicons?sz=128&domain="+
    encodeURIComponent(host);

  hydrateFavicons(root);

function nextOccurrence(
  date,
  frequency,
  customDays=30
){

  const d = new Date(date);

  const config = frequencies[frequency];

  if(!config){

    d.setDate(d.getDate()+7);

    return d;

  }

  if(config.kind==="days"){

    d.setDate(
      d.getDate()+config.interval
    );

    return d;

  }

  if(config.kind==="months"){

    const day = d.getDate();

    d.setDate(1);

    d.setMonth(
      d.getMonth()+config.interval
    );

    const lastDay =
      new Date(
        d.getFullYear(),
        d.getMonth()+1,
        0
      ).getDate();

    d.setDate(
      Math.min(day,lastDay)
    );

    return d;

  }

  d.setDate(
    d.getDate()+
    Math.max(
      1,
      Number(customDays)||30
    )
  );

  return d;

}


function prevOccurrence(
  date,
  frequency,
  customDays=30
){

  const d = new Date(date);
  const config = frequencies[frequency];

  if(!config){
    d.setDate(d.getDate()-7);
    return d;
  }

  if(config.kind==="days"){
    d.setDate(d.getDate()-config.interval);
    return d;
  }

  if(config.kind==="months"){
    const day = d.getDate();
    d.setDate(1);
    d.setMonth(d.getMonth()-config.interval);
    const lastDay = new Date(
      d.getFullYear(),
      d.getMonth()+1,
      0
    ).getDate();
    d.setDate(Math.min(day,lastDay));
    return d;
  }

  d.setDate(
    d.getDate()-Math.max(1, Number(customDays)||30)
  );

  return d;

}


function isOverdue(value){

function daysUntil(value){

  const d = dateValue(value);

  if(!d) return null;

  const now = new Date();

  const today =
    new Date(
      now.getFullYear(),
      now.getMonth(),
      now.getDate()
    );

  const target =
    new Date(
      d.getFullYear(),
      d.getMonth(),
      d.getDate()
    );

  return Math.round(
    (target-today)/
    (1000*60*60*24)
  );

}


function dateDescription(value){

  const days = daysUntil(value);

  if(days === null) return "";

  if(days < 0){

    const n = Math.abs(days);

    return n===1
      ? "Vencido ayer"
      : `Vencido hace ${n} días`;

  }

  if(days===0) return "Hoy";

  if(days===1) return "Mañana";

  if(days<7) return `En ${days} días`;

  return formatShortDate(value);

}

function getPayrollSettings(){

  return {
    payday1:Math.min(
      15,

        Number(payrollSettings.payday1)||15
      )
    ),
    payday2:Math.min(
      31,
      Math.max(

        Number(payrollSettings.payday2)||30
      )
    ),
    payday2LastDay:
      payrollSettings.payday2LastDay!==false
  };

}


function lastDayOfMonth(year,month){

  return new Date(
    year,
    month+1,
    0
  ).getDate();

}


function startOfDay(value){

  const d = dateValue(value);

  if(!d) return null;

  return new Date(
    d.getFullYear(),
    d.getMonth(),
    d.getDate()
  );

}


function makePayday(year,month,which){

  const settings =
    getPayrollSettings();

  const last =
    lastDayOfMonth(year,month);

  if(which===1){

    const day =
      Math.min(
        settings.payday1,
        last
      );

    return new Date(
      year,
      month,
      day
    );

  }

  if(settings.payday2LastDay){

    return new Date(
      year,
      month,
      last
    );

  }

  return new Date(
    year,
    month,
    Math.min(
      settings.payday2,
      last
    )
  );

}


function getQuincenaWindows(now=new Date()){

  const paydays = [];

  const year = now.getFullYear();
  const month = now.getMonth();

  for(let i=-4;i<=10;i++){

    const cursor =
      new Date(year,month+i,1);

    paydays.push(
      makePayday(
        cursor.getFullYear(),
        cursor.getMonth(),
        1
      )
    );

    paydays.push(
      makePayday(
        cursor.getFullYear(),
        cursor.getMonth(),
        2
      )
    );

  }

  paydays.sort(
    (a,b)=>a.getTime()-b.getTime()
  );

  const unique = [];

  paydays.forEach(date=>{

    const prev =
      unique[unique.length-1];

    if(
      !prev ||
      prev.getTime()!==date.getTime()
    ){
      unique.push(date);
    }

  });

  const windows = [];

  for(let i=0;i<unique.length-1;i++){

    const payday = unique[i];
    const nextPayday = unique[i+1];

    windows.push({
      start:payday,
      end:nextPayday,
      payday,
      nextPayday
    });

  }

  return windows;

}


function windowContains(window,date){

  const day = startOfDay(date);

  if(!day || !window) return false;

  return day>=window.start &&
    day<window.end;

}


function getCurrentAndNextWindows(
  now=new Date()
){

  const today = startOfDay(now);
  const windows = getQuincenaWindows(now);

  let currentIndex =
    windows.findIndex(
      window=>windowContains(window,today)
    );

  if(currentIndex<0){

    currentIndex =
      windows.findIndex(
        window=>today<window.end
      );

  }

  const safeIndex =
    currentIndex<0
    ? Math.max(0,windows.length-1)
    : currentIndex;

  return {
    current:windows[safeIndex],
    next:windows[safeIndex+1],
    windows,
    currentIndex:safeIndex
  };

}


function findWindowIndex(
  windows,

){

  return windows.findIndex(

}

function occurrenceDates(payment,until){

  const dates = [];

  let current =
    dateValue(payment.nextPayment);

  if(!current) return dates;

  let guard=0;

  while(
    current &&
    current<=until &&
    guard<24
  ){

    dates.push(
      new Date(
        current.getFullYear(),
        current.getMonth(),
        current.getDate(),
        12,0,0
      )
    );

    current =
      nextOccurrence(
        current,
        payment.frequency,
        payment.customDays
      );

    guard++;

  }

  return dates;

}

function summarizeAccountItems(items,accountId){

  const mine = (items||[]).filter(
    item=>item.account?.id===accountId
  );

  if(!mine.length) return null;

  const dues = mine.filter(item=>item.isDue);
  const base = dues[0] || mine[0];

  return {
    ...base,
    dueCount: dues.length || Number(base.dueCount)||0,
    amount: dues.reduce(
      (sum,item)=>sum+Number(item.amount||0),
      0
    ) || Number(base.amount||0),
    share: mine.reduce(
      (sum,item)=>sum+Number(item.share||0),
      0
    ),
    isDue: dues.length>0,
    overdue: mine.some(item=>item.overdue)
  };

}


function compactQuincenaItems(items){

  const grouped = new Map();

  (items||[]).forEach(item=>{

    const key =
      item.kind==="charges"
      ? "charge:"+(item.account?.id||"")
      : item.payment?.id;

    if(!key) return;

    const current =
      grouped.get(key) || {
        ...item,
        amount:0,
        share:0,
        dueCount:0,
        count:0,
        isDue:false,
        overdue:false
      };

    current.share += Number(item.share||0);
    current.count += 1;
    current.unitAmount = item.unitAmount;
    current.split = item.split;
    current.installment = item.installment;

    if(item.isDue){
      current.isDue = true;
      current.amount += Number(item.amount||0);
      current.dueCount += 1;
      current.due = item.due;
      if(item.overdue) current.overdue = true;
    }
    else if(!current.isDue){
      current.due = item.due;
      current.amount = Number(item.amount||0);
    }

    grouped.set(key,current);

  });

  return [...grouped.values()];

}


function isNextPayable(item){

  if(!item || item.kind==="charges")
    return false;

  if(!item.isDue) return false;

  const next = startOfDay(item.payment?.nextPayment);
  const due = startOfDay(item.due);

  if(!next || !due) return true;

  return due.getTime()===next.getTime();

}
